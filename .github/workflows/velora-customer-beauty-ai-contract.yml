name: Velora Customer Beauty AI Contract Gate

on:
  push:
    branches:
      - audit/runtime-parity-2026-09-28
    paths:
      - "src/scripts/72-s1-e-customer-beauty-ai.js"
      - "src/scripts/61-s1-c-quiz-v2.js"
      - "supabase/functions/velora-beauty-ai-intent/index.ts"
      - "tests/customer-beauty-ai-contract.test.mjs"
      - "package.json"
      - ".github/workflows/velora-customer-beauty-ai-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

# Evidence gate for Customer Beauty AI + canonical Product Detail.
# Re-run after each contract/runtime hardening change.

concurrency:
  group: velora-customer-beauty-ai-contract
  cancel-in-progress: true

jobs:
  contract:
    name: Customer Beauty AI Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Node version
        run: node --version

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/scripts/61-s1-c-quiz-v2.js
          node --check src/scripts/72-s1-e-customer-beauty-ai.js

      - name: Customer Beauty AI contract tests
        run: npm run test:beauty-ai

      - name: Product Detail canonical contract tests
        run: npm run test:product-detail

      - name: Static audit
        run: python3 tools/static_audit.py
