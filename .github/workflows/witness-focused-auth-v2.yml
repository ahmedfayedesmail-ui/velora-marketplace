name: WITNESS Focused Velora Authenticated v3

on:
  push:
    branches:
      - witness/focused-reentry-0-9-1-2026-09-30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://arlaxqmhtvjwjbjinjfw.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout Velora exact source
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install WITNESS 0.9.0 and Playwright
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Restore-Test service key missing"; exit 1; }
          npm install --prefix /tmp/witnesspkg --no-save @witness-engine/cli@0.9.0
          python3 -m pip install --upgrade pip
          python3 -m pip install "playwright==1.57.0"
          python3 -m playwright install --with-deps chromium

      - name: Apply WITNESS 0.9.1 focused-seed fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/witnesspkg/node_modules/@witness-engine/cli/src/scanner.js")
          s=p.read_text()
          old_seed="const seededRoutes=uniqueBy([...seedRoutes({url,repository,changedFiles,mode,focus}),...(webDiscovery.routes||[])].filter(v=>focusMatch(v,focus)),v=>v).slice(0,maxPages*3);"
          new_seed="const seededRoutes=buildSeededRoutes({url,repository,changedFiles,mode,focus,discoveredRoutes:webDiscovery.routes}).slice(0,maxPages*3);"
          helper="""export function buildSeededRoutes({url,repository,changedFiles=[],mode='full',focus=null,discoveredRoutes=[]}={}){
            const routes=[...seedRoutes({url,repository,changedFiles,mode,focus}),...(discoveredRoutes||[])];
            return uniqueBy(routes.filter(v=>v===url || focusMatch(v,focus)),v=>v);
          }

          """
          if "export function buildSeededRoutes(" not in s:
              s=s.replace("export async function scanApplication({",helper+"export async function scanApplication({",1)
          if old_seed not in s:
              raise SystemExit("expected 0.9.0 seededRoutes line not found")
          p.write_text(s.replace(old_seed,new_seed,1))
          PY
          node /tmp/witnesspkg/node_modules/@witness-engine/cli/bin/witness.js doctor

      - name: Start exact-source Velora
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 -d src > /tmp/velora-server.log 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:4173/", timeout=2) as r:
                      if r.status == 200:
                          print("READY")
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("LOCAL_SERVER_NOT_READY")
          PY

      - name: Build one authenticated profile per role
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          from playwright.sync_api import sync_playwright

          BASE=os.environ["SUPABASE_URL"].rstrip("/")
          KEY=os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          APP=os.environ["APP_URL"].rstrip("/")
          pathlib.Path("profiles").mkdir(exist_ok=True)

          def api(path, method="GET", payload=None):
              data=json.dumps(payload).encode() if payload is not None else None
              headers={
                  "apikey":KEY,
                  "Authorization":"Bearer "+KEY,
                  "Content-Type":"application/json",
                  "Accept":"application/json",
              }
              req=urllib.request.Request(BASE+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as resp:
                  raw=resp.read().decode()
                  return json.loads(raw) if raw else None

          users=api("/auth/v1/admin/users?page=1&per_page=1000")
          users=users.get("users",[]) if isinstance(users,dict) else (users or [])
          auth_by_id={str(u.get("id") or ""):u for u in users if u.get("id")}

          def first_role_user(role):
              rows=api("/rest/v1/user_roles?select=user_id&role=eq."+urllib.parse.quote(role))
              for row in rows or []:
                  uid=str(row.get("user_id") or "")
                  if uid in auth_by_id:
                      return uid
              raise RuntimeError("No Auth user found for role "+role)

          def first_approved_seller_user():
              rows=api("/rest/v1/sellers?select=user_id,status&status=eq.approved&limit=50")
              for row in rows or []:
                  uid=str(row.get("user_id") or "")
                  if uid not in auth_by_id:
                      continue
                  roles=api("/rest/v1/user_roles?select=user_id&user_id=eq."+urllib.parse.quote(uid)+"&role=eq.seller")
                  if roles:
                      return uid
              raise RuntimeError("No approved seller Auth user found")

          def email_for(uid):
              e=str(auth_by_id[uid].get("email") or "")
              if not e:
                  raise RuntimeError("Email missing for auth user "+uid)
              return e

          def magic_hash(email, redirect_hash):
              result=api("/auth/v1/admin/generate_link",method="POST",payload={
                  "type":"magiclink",
                  "email":email,
                  "options":{"redirect_to":APP+"/#"+redirect_hash}
              })
              token=str(result.get("hashed_token") or "")
              if not token:
                  raise RuntimeError("generate_link returned no hashed_token")
              return token

          seller_uid=first_approved_seller_user()
          admin_uid=first_role_user("admin")

          with sync_playwright() as pw:
              browser=pw.chromium.launch()
              def build(uid,path,redirect_hash):
                  page=browser.new_page(viewport={"width":390,"height":844},locale="en-EG")
                  page.goto(APP+"/#home",wait_until="domcontentloaded",timeout=60000)
                  token=magic_hash(email_for(uid),redirect_hash)
                  page.wait_for_timeout(250)
                  result=page.evaluate("""async tokenHash=>{
                    try{
                      const r=await window.mahaSupabase.auth.verifyOtp({token_hash:tokenHash,type:"magiclink"});
                      return {ok:!!r?.data?.session?.user,id:r?.data?.session?.user?.id||null,error:r?.error?.message||null};
                    }catch(e){
                      return {ok:false,id:null,error:String(e?.message||e)};
                    }
                  }""",token)
                  if not result.get("ok") or str(result.get("id") or "")!=uid:
                      raise RuntimeError("Auth verify failed for "+path+": "+str(result))
                  page.wait_for_timeout(800)
                  session=page.evaluate("""async()=>{
                    const r=await window.mahaSupabase.auth.getSession();
                    return {ok:!!r?.data?.session?.user,id:r?.data?.session?.user?.id||null};
                  }""")
                  if not session.get("ok") or str(session.get("id") or "")!=uid:
                      raise RuntimeError("Session missing for "+path)
                  page.context.storage_state(path=path)
                  page.close()
              build(seller_uid,"profiles/seller.json","seller")
              build(admin_uid,"profiles/admin.json","admin")
              browser.close()

          pathlib.Path("profiles.json").write_text(json.dumps({
              "seller":"profiles/seller.json",
              "admin":"profiles/admin.json"
          },indent=2))
          print("PROFILES_READY=seller,admin")
          PY

      - name: Authorize local WITNESS target
        run: |
          node /tmp/witnesspkg/node_modules/@witness-engine/cli/bin/witness.js target authorize-local             --url "$APP_URL"             --repo .             --output ./witness-grant.json

      - name: Run authenticated Seller focus
        shell: bash
        run: |
          set +e
          node /tmp/witnesspkg/node_modules/@witness-engine/cli/bin/witness.js scan             --url "$APP_URL#seller"             --grant ./witness-grant.json             --repo .             --mode focus             --focus seller             --personas seller             --profiles ./profiles.json             --explore             --max-pages 12             --max-actions 6             --allow-private-origin             --output ./witness-seller
          echo "SELLER_EXIT=$?"
          exit 0

      - name: Run authenticated Admin focus
        shell: bash
        run: |
          set +e
          node /tmp/witnesspkg/node_modules/@witness-engine/cli/bin/witness.js scan             --url "$APP_URL#admin"             --grant ./witness-grant.json             --repo .             --mode focus             --focus admin             --personas admin             --profiles ./profiles.json             --explore             --max-pages 12             --max-actions 6             --allow-private-origin             --output ./witness-admin
          echo "ADMIN_EXIT=$?"
          exit 0

      - name: Run authenticated RTL/Admin focus
        shell: bash
        run: |
          set +e
          node /tmp/witnesspkg/node_modules/@witness-engine/cli/bin/witness.js scan             --url "$APP_URL#admin"             --grant ./witness-grant.json             --repo .             --mode focus             --focus admin             --personas rtl             --profiles ./profiles.json             --explore             --max-pages 12             --max-actions 6             --allow-private-origin             --output ./witness-rtl-admin
          echo "RTL_ADMIN_EXIT=$?"
          exit 0

      - name: Summarize focused results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("seller","admin","rtl-admin"):
              p=Path(f"witness-{name}/result.json")
              if not p.exists():
                  print(name+": NO_RESULT")
                  continue
              r=json.loads(p.read_text())
              s=r.get("summary",{})
              print("SUMMARY",json.dumps({
                  "run":name,
                  "pagesVisited":s.get("pagesVisited"),
                  "routesDiscovered":s.get("routesDiscovered"),
                  "personasExecuted":s.get("personasExecuted"),
                  "safeActionsExecuted":s.get("safeActionsExecuted"),
                  "confirmedFindings":s.get("confirmedFindings"),
                  "high":s.get("high"),
                  "medium":s.get("medium"),
                  "low":s.get("low"),
                  "routeCoverage":r.get("coverage",{}).get("routeCoverage")
              },ensure_ascii=False))
          PY

      - name: Verify all focused evidence
        if: always()
        continue-on-error: true
        run: |
          for d in witness-seller witness-admin witness-rtl-admin; do
            if [ -f "$d/manifest.json" ]; then
              node /tmp/witnesspkg/node_modules/@witness-engine/cli/bin/witness.js verify --bundle "$d"
            else
              echo "SKIP_VERIFY=$d"
            fi
          done

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witness-focused-authenticated-v3
          path: |
            witness-seller/
            witness-admin/
            witness-rtl-admin/
            profiles.json
            profiles/
            witness-grant.json
            /tmp/velora-server.log
          if-no-files-found: warn
          retention-days: 7
