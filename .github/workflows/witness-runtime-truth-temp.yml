name: WITNESS Runtime Truth — Velora temporary

on:
  push:
    branches:
      - "ops/witness-runtime-truth-2026-09-30"

permissions:
  contents: read

jobs:
  runtime-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://arlaxqmhtvjwjbjinjfw.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout Velora exact source
        uses: actions/checkout@v4
        with:
          path: velora

      - name: Prepare WITNESS 0.9.1 runtime + current draft generator
        run: |
          set -euo pipefail
          rm -rf /tmp/witnesspkg
          npm install --prefix /tmp/witnesspkg --no-save @witness-engine/cli@0.9.1
          node /tmp/witnesspkg/node_modules/@witness-engine/cli/bin/witness.js doctor
          printf '%s' '' | base64 -d > /tmp/witnesspkg/node_modules/@witness-engine/cli/src/business-truth-drafts.js
          test -f /tmp/witnesspkg/node_modules/@witness-engine/cli/src/business-truth-drafts.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chromium
        run: npx --prefix /tmp/witnesspkg playwright install --with-deps chromium

      - name: Start Velora exact-source server
        run: |
          nohup python3 -m http.server 4173 -d velora/src > /tmp/velora-runtime.log 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:4173/",timeout=2) as r:
                      if r.status == 200:
                          print("VELORA_READY")
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("VELORA_NOT_READY")
          PY

      - name: Validate Supabase test access
        run: |
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/notifications?select=id&limit=1" > /dev/null

      - name: Build authenticated WITNESS profiles
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          from playwright.sync_api import sync_playwright

          BASE=os.environ["SUPABASE_URL"].rstrip("/")
          KEY=os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          APP=os.environ["APP_URL"].rstrip("/")
          HDR={"apikey":KEY,"Authorization":"Bearer "+KEY,"Accept":"application/json"}
          pathlib.Path("profiles").mkdir(exist_ok=True)

          def api(path, method="GET", payload=None):
              data=json.dumps(payload).encode() if payload is not None else None
              headers=dict(HDR)
              if payload is not None: headers["Content-Type"]="application/json"
              req=urllib.request.Request(BASE+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as resp:
                  raw=resp.read().decode()
                  return json.loads(raw) if raw else None

          users=api("/auth/v1/admin/users?page=1&per_page=1000")
          users=users.get("users",[]) if isinstance(users,dict) else (users or [])
          auth={str(u.get("id") or ""):u for u in users if u.get("id")}

          def role_user(role):
              rows=api("/rest/v1/user_roles?select=user_id&role=eq."+urllib.parse.quote(role))
              for row in rows or []:
                  uid=str(row.get("user_id") or "")
                  if uid in auth: return uid
              raise RuntimeError("NO_AUTH_USER_FOR_ROLE:"+role)

          def approved_seller():
              rows=api("/rest/v1/sellers?select=user_id,status&status=eq.approved&limit=50")
              for row in rows or []:
                  uid=str(row.get("user_id") or "")
                  if uid not in auth: continue
                  roles=api("/rest/v1/user_roles?select=user_id&user_id=eq."+urllib.parse.quote(uid)+"&role=eq.seller")
                  if roles: return uid
              raise RuntimeError("NO_APPROVED_SELLER_AUTH_USER")

          def email(uid):
              value=str(auth[uid].get("email") or "")
              if not value: raise RuntimeError("NO_EMAIL:"+uid)
              return value

          def magic(mail):
              r=api("/auth/v1/admin/generate_link","POST",{
                  "type":"magiclink",
                  "email":mail,
                  "options":{"redirect_to":APP+"/#home"}
              })
              token=str(r.get("hashed_token") or "")
              if not token: raise RuntimeError("NO_MAGIC_HASH")
              return token

          seller_uid=approved_seller()
          admin_uid=role_user("admin")
          owner_uid=role_user("owner")

          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)

              def build(uid,path,arabic=False):
                  page=browser.new_page(viewport={"width":1440,"height":1000},locale=("ar-EG" if arabic else "en-EG"))
                  page.goto(APP+"/#home",wait_until="domcontentloaded",timeout=60000)
                  token=magic(email(uid))
                  r=page.evaluate("""async t=>{
                    const x=await window.mahaSupabase.auth.verifyOtp({token_hash:t,type:"magiclink"});
                    return {ok:!!x?.data?.session?.user,id:x?.data?.session?.user?.id||null,error:x?.error?.message||null};
                  }""",token)
                  if not r.get("ok") or str(r.get("id") or "")!=uid:
                      raise RuntimeError("AUTH_VERIFY_FAILED:"+path+":"+str(r))
                  page.wait_for_timeout(1800)
                  if arabic:
                      rr=page.evaluate("""async()=>{
                        try{
                          if(typeof window.VELORA_V5_SET_LANGUAGE!=="function") return {ok:false,error:"V5_SET_LANGUAGE_UNAVAILABLE"};
                          return {ok:!!(await window.VELORA_V5_SET_LANGUAGE("ar"))};
                        }catch(e){return {ok:false,error:String(e?.message||e)};}
                      }""")
                      if not rr.get("ok"): raise RuntimeError("ARABIC_SET_FAILED:"+path)
                      page.wait_for_timeout(1400)
                  sess=page.evaluate("""async()=>{
                    const r=await window.mahaSupabase.auth.getSession();
                    return {ok:!!r?.data?.session?.user,id:r?.data?.session?.user?.id||null};
                  }""")
                  if not sess.get("ok") or str(sess.get("id") or "")!=uid:
                      raise RuntimeError("SESSION_MISSING:"+path)
                  page.context.storage_state(path=path)
                  page.close()

              build(seller_uid,"profiles/seller.json",False)
              build(admin_uid,"profiles/admin.json",False)
              build(owner_uid,"profiles/owner.json",False)
              build(admin_uid,"profiles/rtl.json",True)
              browser.close()

          pathlib.Path("profiles.json").write_text(json.dumps({
              "seller":"profiles/seller.json",
              "admin":"profiles/admin.json",
              "owner":"profiles/owner.json",
              "rtl":"profiles/rtl.json"
          },indent=2))
          print("WITNESS_RUNTIME_PROFILES_READY")
          PY

      - name: Create local WITNESS authorization
        run: |
          node /tmp/witnesspkg/node_modules/@witness-engine/cli/bin/witness.js target authorize-local \
            --url "$APP_URL" \
            --repo ./velora \
            --output ./witness-grant.json

      - name: Run authenticated WITNESS runtime scan
        run: |
          set +e
          node /tmp/witnesspkg/node_modules/@witness-engine/cli/bin/witness.js scan \
            --url "$APP_URL#home" \
            --grant ./witness-grant.json \
            --repo ./velora \
            --mode full \
            --personas seller,admin,owner,rtl \
            --profiles ./profiles.json \
            --explore \
            --max-pages 20 \
            --max-actions 8 \
            --allow-private-origin \
            --output ./velora-witness-runtime
          rc=$?
          echo "WITNESS_SCAN_EXIT_CODE=$rc"
          exit 0

      - name: Generate runtime-linked Business Truth drafts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import { inspectRepository } from "/tmp/witnesspkg/node_modules/@witness-engine/cli/src/repository.js";
          import { generateBusinessTruthDrafts, writeBusinessTruthDrafts } from "/tmp/witnesspkg/node_modules/@witness-engine/cli/src/business-truth-drafts.js";
          const repository = await inspectRepository("./velora");
          const result = JSON.parse(await fs.readFile("./velora-witness-runtime/result.json","utf8"));
          const drafts = generateBusinessTruthDrafts({repository,result,contracts:[]});
          await writeBusinessTruthDrafts("./velora-business-truth-drafts.json",drafts);
          console.log(JSON.stringify({summary:drafts.summary},null,2));
          NODE
          echo "=== DRAFT SUMMARY ==="
          cat ./velora-business-truth-drafts.json

      - name: Verify evidence bundle
        if: always()
        run: node /tmp/witnesspkg/node_modules/@witness-engine/cli/bin/witness.js verify --bundle ./velora-witness-runtime || true

      - name: Upload runtime evidence + drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-runtime-truth-drafts-0-9-1
          path: |
            velora-witness-runtime/
            velora-business-truth-drafts.json
            /tmp/velora-runtime.log
          retention-days: 7
