name: WITNESS Cross-Origin Payment Truth Gate

on:
  push:
    branches:
      - witness/business-truth-cross-origin-2026-09-30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: witness-cross-origin-payment-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install WITNESS and Playwright
        run: |
          npm install -g @witness-engine/cli@0.9.1 playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Checkout pinned WITNESS source
        uses: actions/checkout@v6
        with:
          repository: ahmedfayedesmail-ui/witness-engine
          ref: 3c5ce4c94975da3be3ff928ea780389beb443a86
          path: .witness-source

      - name: Pin WITNESS business-truth engine
        run: |
          set -euo pipefail
          engine_file="$(npm root -g)/@witness-engine/cli/src/business-truth.js"
          cp .witness-source/src/business-truth.js "$engine_file"
          cp .witness-source/src/business-truth.js .witness-business-truth.js
          node --check "$engine_file"

      - name: Start Velora local runtime
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --directory src >/tmp/velora-http.log 2>&1 &
          echo $! >/tmp/velora-http.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/velora-http.log || true
          exit 1

      - name: Run browser claim and WITNESS truth gate
        env:
          SUPABASE_URL: https://arlaxqmhtvjwjbjinjfw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_RDyqYgvJyT37RiQ1PNxYuQ_ov_8eceA
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          WITNESS_ENGINE_FILE: ${{ github.workspace }}/.witness-business-truth.js
          VELORA_LOCAL_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          export WITNESS_ENGINE_FILE="$(pwd)/.witness-business-truth.js"
          cp "$(npm root -g)/@witness-engine/cli/src/business-truth.js" "$WITNESS_ENGINE_FILE"
          node evidence/witness/run-cross-origin-payment-gate.mjs

      - name: Validate gate evidence
        run: node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('evidence/witness/cross-origin-browser-gate.json','utf8'));if(!x.passed||x.businessTruth.consistent!==1||x.businessTruth.contradictions!==0||x.businessTruth.observationMode!=='cross-origin'||!x.businessTruth.allowedOrigin||!x.browserClaim.observed)process.exit(1);console.log(JSON.stringify(x,null,2));"

      - name: Commit sanitized evidence
        if: always()
        run: |
          set -euo pipefail
          git add -f evidence/witness/browser-claim-proof.json evidence/witness/cross-origin-browser-gate.json evidence/witness/cross-origin-business-truth-observation.json
          if git diff --cached --quiet; then
            echo "No sanitized evidence to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "evidence: verify cross-origin payment business truth"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Stop Velora runtime
        if: always()
        run: |
          if [ -f /tmp/velora-http.pid ]; then kill "$(cat /tmp/velora-http.pid)" || true; fi
