name: WITNESS Cross-Origin Payment Truth Gate

on:
  push:
    branches:
      - witness/business-truth-cross-origin-2026-09-30
    paths:
      - "src/**"
      - "evidence/witness/velora-payment-business-truth.v1.json"
      - ".github/workflows/witness-cross-origin-payment.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: witness-cross-origin-payment-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install WITNESS 0.9.1 and browser
        run: |
          npm install -g @witness-engine/cli@0.9.1 playwright@1.57.0
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.57.0"
          python -m playwright install chromium

      - name: Inject verified WITNESS business-truth engine source
        env:
          WITNESS_BUSINESS_TRUTH_B64: ""
        run: |
          set -euo pipefail
          engine_file="$(npm root -g)/@witness-engine/cli/src/business-truth.js"
          printf '%s' "$WITNESS_BUSINESS_TRUTH_B64" | base64 --decode > "$engine_file"
          node --check "$engine_file"
          ENGINE_FILE="$engine_file" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const { loadBusinessTruthContractsObject, resolveReadOnlyApiUrl } = await import(process.env.ENGINE_FILE);
          assert.equal(resolveReadOnlyApiUrl('http://127.0.0.1:4173/?velora_order_id=order-42','https://arlaxqmhtvjwjbjinjfw.supabase.co/rest/v1/orders?id=eq.{{query:velora_order_id}}&select=id',{allowedOrigins:['https://arlaxqmhtvjwjbjinjfw.supabase.co']}),'https://arlaxqmhtvjwjbjinjfw.supabase.co/rest/v1/orders?id=eq.order-42&select=id');
          assert.throws(()=>resolveReadOnlyApiUrl('http://127.0.0.1:4173/','https://evil.example/state',{allowedOrigins:['https://arlaxqmhtvjwjbjinjfw.supabase.co']}));
          assert.throws(()=>loadBusinessTruthContractsObject({schema:'witness-business-truth.v1',checks:[{id:'x',api:{method:'GET',path:'https://data.example/state',observation:{mode:'cross-origin'}}}]}));
          console.log('cross-origin business-truth engine smoke test passed');
          NODE
      - name: Start Velora local runtime
        run: |
          nohup python3 -m http.server 4173 --directory src >/tmp/velora-http.log 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:4173/",timeout=2) as r:
                      assert r.status == 200
                      print("local runtime ready")
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("local runtime did not start")
          PY

      - name: Authenticate and verify visible payment success
        env:
          SUPABASE_URL: https://arlaxqmhtvjwjbjinjfw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_RDyqYgvJyT37RiQ1PNxYuQ_ov_8eceA
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          base=os.environ["SUPABASE_URL"].rstrip("/")
          key=os.environ["SUPABASE_PUBLISHABLE_KEY"]
          email=os.environ["E2E_EMAIL"]
          password=os.environ["E2E_PASSWORD"]

          def request_json(method,url,body=None,headers=None):
              data=None
              h=dict(headers or {})
              if body is not None:
                  data=json.dumps(body).encode()
                  h.setdefault("Content-Type","application/json")
              req=urllib.request.Request(url,method=method,data=data,headers=h)
              with urllib.request.urlopen(req,timeout=30) as resp:
                  raw=resp.read().decode()
                  return resp.status, json.loads(raw) if raw else {}

          status,auth=request_json("POST",f"{base}/auth/v1/token?grant_type=password",
              {"email":email,"password":password},{"apikey":key})
          if status!=200 or not auth.get("access_token") or not (auth.get("user") or {}).get("id"):
              raise SystemExit("E2E authentication failed")

          access=auth["access_token"]
          user_id=auth["user"]["id"]
          headers={"apikey":key,"Authorization":f"Bearer {access}"}
          q=urllib.parse.urlencode({
              "customer_id":f"eq.{user_id}",
              "status":"eq.confirmed",
              "payment_status":"eq.paid",
              "select":"id,order_number",
              "order":"created_at.desc",
              "limit":"1",
          },safe=",")
          status,rows=request_json("GET",f"{base}/rest/v1/orders?{q}",headers=headers)
          if status!=200 or not rows:
              raise SystemExit("No owned paid+confirmed order is available for the browser claim gate")
          order_id=str(rows[0]["id"])

          session={
              "access_token":access,
              "refresh_token":auth.get("refresh_token",""),
              "expires_in":auth.get("expires_in"),
              "expires_at":auth.get("expires_at"),
              "token_type":auth.get("token_type","bearer"),
              "user":auth["user"]
          }
          storage_key="sb-arlaxqmhtvjwjbjinjfw-auth-token"
          target="http://127.0.0.1:4173/?velora_order_id="+urllib.parse.quote(order_id,safe="")

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(viewport={"width":390,"height":844})
              context.add_init_script(f"localStorage.setItem({json.dumps(storage_key)}, {json.dumps(json.dumps(session))});")
              page=context.new_page()
              page.goto(target,wait_until="domcontentloaded",timeout=45000)
              claim=False
              for _ in range(24):
                  body=page.locator("body").inner_text()
                  if "Payment successful" in body:
                      claim=True
                      break
                  time.sleep(1)
              if not claim:
                  page.screenshot(path="/tmp/payment-return-failed.png",full_page=True)
                  raise SystemExit("Velora browser success claim was not rendered")
              context.storage_state(path="customer-state.json")
              browser.close()

          Path("profiles.json").write_text(json.dumps({"customer":str(Path.cwd()/"customer-state.json")}),encoding="utf-8")
          Path("paid-order-id.txt").write_text(order_id,encoding="utf-8")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write("WITNESS_VELORA_SUPABASE_AUTHORIZATION=Bearer "+access+"\n")
          Path("evidence/witness/browser-claim-proof.json").write_text(json.dumps({
              "schema":"witness-browser-claim-proof.v1",
              "ownedPaidConfirmedOrderFound":True,
              "browserSuccessClaimObserved":True,
              "successText":"Payment successful"
          },indent=2)+"\n",encoding="utf-8")
          print("browser success claim observed")
          PY

      - name: Authorize local WITNESS target
        run: |
          set -euo pipefail
          ORDER_ID="$(cat paid-order-id.txt)"
          witness target authorize-local             --url "http://127.0.0.1:4173/?velora_order_id=$ORDER_ID"             --repo "$GITHUB_WORKSPACE"             --output witness-local-grant.json

      - name: Run WITNESS cross-origin truth gate
        env:
          SUPABASE_URL: https://arlaxqmhtvjwjbjinjfw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_RDyqYgvJyT37RiQ1PNxYuQ_ov_8eceA
        run: |
          set +e
          ORDER_ID="$(cat paid-order-id.txt)"
          witness scan             --url "http://127.0.0.1:4173/?velora_order_id=$ORDER_ID"             --repo "$GITHUB_WORKSPACE"             --grant witness-local-grant.json             --profiles profiles.json             --personas customer             --truth evidence/witness/velora-payment-business-truth.v1.json             --allow-private-origin             --explore             --max-pages 1             --max-actions 2             --output witness-cross-origin-run >/tmp/witness-cli.json
          printf '%s' "$?" > /tmp/witness-exit-code
          exit 0

      - name: Build sanitized gate evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("witness-cross-origin-run/result.json").read_text())
          observations=result.get("businessTruth") or []
          target=[o for o in observations if o.get("checkId")=="velora-payment-return-order-truth"]
          consistent=[o for o in target if o.get("verdict")=="CONSISTENT"]
          contradictions=[o for o in target if o.get("verdict")=="CONTRADICTION"]
          gate={
              "schema":"witness-cross-origin-payment-gate.v1",
              "witnessPackageVersion":"0.9.1",
              "browserClaim":{"observed":True,"text":"Payment successful"},
              "businessTruth":{
                  "checksObserved":len(target),
                  "consistent":len(consistent),
                  "contradictions":len(contradictions),
                  "observationModes":sorted({((o.get("api") or {}).get("observation") or {}).get("mode") for o in target if ((o.get("api") or {}).get("observation") or {}).get("mode"})
              },
              "witnessScan":{
                  "runId":result.get("runId"),
                  "businessTruthChecks":result.get("summary",{}).get("businessTruthChecks",0),
                  "businessTruthContradictions":result.get("summary",{}).get("businessTruthContradictions",0),
                  "confirmedFindings":result.get("summary",{}).get("confirmedFindings",0),
                  "exitCode":int(Path("/tmp/witness-exit-code").read_text())
              },
              "passed":bool(consistent) and not contradictions,
              "safety":{
                  "productionTouched":False,
                  "realMoneyMoved":False,
                  "destructiveBrowserActions":False,
                  "authStorageStatesUploaded":False
              }
          }
          Path("evidence/witness/cross-origin-browser-gate.json").write_text(json.dumps(gate,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(gate,ensure_ascii=False,indent=2))
          if not gate["passed"]:
              raise SystemExit("WITNESS cross-origin payment truth gate failed")
          PY

      - name: Commit sanitized verification evidence
        if: always()
        run: |
          rm -f customer-state.json profiles.json witness-local-grant.json paid-order-id.txt
          rm -rf witness-cross-origin-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f evidence/witness/browser-claim-proof.json evidence/witness/cross-origin-browser-gate.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No verification evidence to commit."
            exit 0
          fi
          git commit -m "evidence: verify cross-origin payment business truth"
          git push origin "HEAD:$GITHUB_REF_NAME"
