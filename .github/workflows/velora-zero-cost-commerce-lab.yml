name: Velora Zero-Cost Commerce Lab

on:
  push:
    branches:
      - audit/runtime-parity-2026-09-28
    paths:
      - "tools/velora_zero_cost_commerce_lab.py"
      - ".github/workflows/velora-zero-cost-commerce-lab.yml"
      - ".remote/commerce-lab.json"
      - "src/scripts/13-payments.js"
      - "src/scripts/35-seller.js"
      - "src/scripts/59-s1-b2-beauty-recommendations.js"
      - "src/scripts/62-s1-c-routine-cart.js"
      - "src/scripts/71-customer-orders-returns.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velora-zero-cost-commerce-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    name: Deterministic Commerce Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: audit/runtime-parity-2026-09-28
          fetch-depth: 1
      - name: Run dependency-free scenario lab
        run: python3 tools/velora_zero_cost_commerce_lab.py
      - name: Syntax gate on governed commerce surfaces
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            src/scripts/13-payments.js \
            src/scripts/35-seller.js \
            src/scripts/59-s1-b2-beauty-recommendations.js \
            src/scripts/62-s1-c-routine-cart.js \
            src/scripts/71-customer-orders-returns.js
          do
            node --check "$f"
          done
      - name: Publish summary
        if: always()
        run: |
          cat zero-cost-commerce-lab.md >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-zero-cost-commerce-lab
          path: |
            zero-cost-commerce-lab.json
            zero-cost-commerce-lab.md
          retention-days: 3
