name: Velora Local Source Browser Gate

on:
  workflow_dispatch:
  push:
    branches:
      - audit/full-gate-2026-09-25

permissions:
  contents: read

jobs:
  local-source-browser:
    name: Local source -> Authenticated browser evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/full-gate-2026-09-25

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Start local source server
        run: |
          python3 -m http.server 4173 -d src > /tmp/velora-local-source.log 2>&1 &
          echo $! > /tmp/velora-local-source.pid
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:4173/", timeout=2) as r:
                      if r.status == 200:
                          print("Local source server is ready")
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          print(open("/tmp/velora-local-source.log", encoding="utf-8").read())
          raise SystemExit(1)
          PY

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium

      - name: Run local source browser evidence
        env:
          BASE_URL: http://127.0.0.1:4173
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os, sys
          from playwright.sync_api import sync_playwright

          base = os.environ["BASE_URL"].rstrip("/")
          email = os.environ.get("E2E_EMAIL", "")
          password = os.environ.get("E2E_PASSWORD", "")
          test_product = "21d977a0-111b-4bb4-9736-0f2994294d48"
          test_store = "11111111-2222-4333-8444-555555555555"

          result = {
              "browser_evidence_schema": "local-source-v1",
              "base_url": base,
              "checks": {},
              "console_errors": [],
              "page_errors": [],
          }

          if not email or not password:
              result["failures"] = ["Missing E2E_EMAIL/E2E_PASSWORD repository secrets"]
              with open("browser-local-source-evidence.json", "w", encoding="utf-8") as f:
                  json.dump(result, f, ensure_ascii=False, indent=2)
              print(json.dumps(result, ensure_ascii=False, indent=2))
              sys.exit(1)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1000}, locale="en-US")

              page.on("console", lambda m: result["console_errors"].append(m.text) if m.type == "error" else None)
              page.on("pageerror", lambda e: result["page_errors"].append({"message": str(e), "stack": getattr(e, "stack", None)}))

              response = page.goto(base + "/#store/" + test_store, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(4000)

              result["checks"]["initial_store_hash"] = page.url.split("#")[-1]
              result["checks"]["initial_store_route_id"] = page.evaluate("() => window.VELORA_STORE_ROUTE_ID || null")
              result["checks"]["http_status"] = response.status if response else None
              result["checks"]["store_route_active"] = (
                  "active" in (page.locator("#page-store").get_attribute("class") or "")
                  if page.locator("#page-store").count() else False
              )

              store_text = page.locator("#storeDetailContent").inner_text() if page.locator("#storeDetailContent").count() else ""
              result["checks"]["store_name"] = "E2E Seller Store" in store_text
              result["checks"]["store_products_5"] = sum(
                  1 for name in (
                      "Test Vitamin C Serum",
                      "QA Seed Anti-Aging Treatment",
                      "QA Seed Barrier Moisturizer",
                      "QA Seed Cleanser",
                      "QA Seed SPF 50 Protect",
                  ) if name in store_text
              ) == 5

              page.goto(base + "/#shops", wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(1800)
              card = page.locator(".velora-store-card").filter(has_text="E2E Seller Store").first
              result["checks"]["shops_store_card"] = card.count() == 1
              if card.count() == 1:
                  card.locator("button").first.click()
                  page.wait_for_timeout(1800)

              result["checks"]["shops_to_store_hash"] = page.url.split("#")[-1] == "store/" + test_store
              result["checks"]["shops_to_store_active"] = (
                  "active" in (page.locator("#page-store").get_attribute("class") or "")
                  if page.locator("#page-store").count() else False
              )

              back = page.locator("#storeDetailContent button").filter(has_text="Back to Shops").first
              result["checks"]["store_back_button"] = back.count() == 1
              if back.count() == 1:
                  back.click()
                  page.wait_for_timeout(900)
              result["checks"]["store_back_to_shops"] = (
                  "active" in (page.locator("#page-shops").get_attribute("class") or "")
                  if page.locator("#page-shops").count() else False
              ) and page.url.split("#")[-1] == "shops"

              page.goto(base + "/#shop", wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(1500)
              page.evaluate("(productId) => window.openProductDetail(productId)", test_product)
              page.wait_for_timeout(1800)

              detail_text = page.locator("#productModalContent").inner_text() if page.locator("#productModalContent").count() else ""
              product_state = page.evaluate(
                  """(productId) => {
                      const p = (window.MAHA_DATA?.PRODUCTS || []).find(x => x.id === productId);
                      return p ? {
                          storeId: p.storeId || null,
                          hydrated: p._veloraDetailHydrated === true
                      } : null;
                  }""",
                  test_product,
              )

              result["checks"]["product_modal_active"] = (
                  "active" in (page.locator("#productModal").get_attribute("class") or "")
                  if page.locator("#productModal").count() else False
              )
              result["checks"]["product_canonical_hydrated"] = bool(product_state and product_state.get("hydrated"))
              result["checks"]["product_store_id"] = product_state.get("storeId") if product_state else None
              result["checks"]["related_heading"] = "You May Also Like" in detail_text
              result["checks"]["related_excludes_source"] = detail_text.count("Test Vitamin C Serum") == 1

              visit = page.locator("#productModalContent button").filter(has_text="Visit Store").first
              result["checks"]["product_visit_store_button"] = visit.count() == 1
              result["checks"]["product_visit_store_visible"] = visit.is_visible() if visit.count() == 1 else False
              if visit.count() == 1:
                  try:
                      visit.scroll_into_view_if_needed(timeout=3000)
                      page.wait_for_timeout(250)
                  except Exception as exc:
                      result["checks"]["product_visit_store_scroll_error"] = str(exc)[:500]
                  box = visit.bounding_box()
                  if box and box["width"] > 0 and box["height"] > 0:
                      hit = page.evaluate(
                          """({x,y}) => {
                              const el = document.elementFromPoint(x,y);
                              const button = Array.from(document.querySelectorAll("#productModalContent button"))
                                .find(b => /Visit Store/i.test(b.textContent || ""));
                              return !!(el && button && (el === button || button.contains(el)));
                          }""",
                          {"x": box["x"] + box["width"] / 2, "y": box["y"] + box["height"] / 2},
                      )
                      result["checks"]["product_visit_store_hit_test_clear"] = bool(hit)
                      if not hit:
                          result["checks"]["product_visit_store_hit_test_blocker"] = page.evaluate(
                              """({x,y}) => {
                                  const el = document.elementFromPoint(x,y);
                                  if (!el) return null;
                                  return {
                                      tag: el.tagName,
                                      id: el.id || null,
                                      className: typeof el.className === "string" ? el.className : null,
                                      text: String(el.innerText || el.textContent || "").slice(0,180),
                                      elementsFromPoint: document.elementsFromPoint(x,y).slice(0,8).map(n => ({
                                          tag: n.tagName,
                                          id: n.id || null,
                                          className: typeof n.className === "string" ? n.className : null
                                      }))
                                  };
                              }""",
                              {"x": box["x"] + box["width"] / 2, "y": box["y"] + box["height"] / 2},
                          )
                          result["checks"]["product_visit_store_style_diag"] = page.evaluate(
                              """() => {
                                  const button = Array.from(document.querySelectorAll("#productModalContent button"))
                                    .find(b => /Visit Store/i.test(b.textContent || ""));
                                  const modal = document.querySelector("#productModal");
                                  const content = document.querySelector("#productModalContent");
                                  if (!button) return null;
                                  const cs = getComputedStyle(button);
                                  const r = button.getBoundingClientRect();
                                  const mr = modal ? modal.getBoundingClientRect() : null;
                                  const cr = content ? content.getBoundingClientRect() : null;
                                  return {
                                      buttonRect: {x:r.x,y:r.y,width:r.width,height:r.height},
                                      buttonPointerEvents: cs.pointerEvents,
                                      buttonPosition: cs.position,
                                      buttonZIndex: cs.zIndex,
                                      buttonOpacity: cs.opacity,
                                      modalRect: mr ? {x:mr.x,y:mr.y,width:mr.width,height:mr.height} : null,
                                      contentRect: cr ? {x:cr.x,y:cr.y,width:cr.width,height:cr.height} : null
                                  };
                              }"""
                          )
                  else:
                      result["checks"]["product_visit_store_hit_test_clear"] = False
                      result["checks"]["product_visit_store_hit_test_blocker"] = None

                  try:
                      visit.click(timeout=3000)
                      result["checks"]["product_visit_store_normal_click_ok"] = True
                  except Exception as exc:
                      result["checks"]["product_visit_store_normal_click_ok"] = False
                      result["checks"]["product_visit_store_normal_click_error"] = str(exc)[:500]
                      try:
                          visit.click(force=True, timeout=3000)
                          result["checks"]["product_visit_store_force_click_ok"] = True
                      except Exception as force_exc:
                          result["checks"]["product_visit_store_force_click_ok"] = False
                          result["checks"]["product_visit_store_force_click_error"] = str(force_exc)[:500]
                  page.wait_for_timeout(1800)

              result["checks"]["product_visit_store_hash"] = page.url.split("#")[-1] == "store/" + test_store
              result["checks"]["product_visit_store_active"] = (
                  "active" in (page.locator("#page-store").get_attribute("class") or "")
                  if page.locator("#page-store").count() else False
              )

              page.evaluate("() => closeModal('productModal')")
              page.evaluate("() => openAuthModal('login')")
              page.locator("#loginEmail").fill(email)
              page.locator("#loginPassword").fill(password)
              page.locator("#authFormContent button[type='submit']").click()
              page.wait_for_timeout(3600)

              auth = page.evaluate("""async () => {
                  try {
                      const r = await window.mahaSupabase.auth.getSession();
                      return {
                          hasSession: !!r?.data?.session?.user,
                          userId: r?.data?.session?.user?.id || null
                      };
                  } catch (_) {
                      return {hasSession:false,userId:null};
                  }
              }""")

              result["checks"]["authenticated_session"] = bool(auth["hasSession"])
              result["checks"]["authenticated_user_id"] = bool(auth["userId"])

              locale_result = page.evaluate("""async () => {
                  try {
                      const fn = window.VELORA_V5_SET_LANGUAGE;
                      if (typeof fn !== "function") return {ok:false, reason:"V5_SET_LANGUAGE_UNAVAILABLE"};
                      return {ok:!!(await fn("ar"))};
                  } catch (e) {
                      return {ok:false, reason:String(e?.message || e)};
                  }
              }""")
              result["checks"]["arabic_locale_set_ok"] = bool(locale_result.get("ok"))
              page.wait_for_timeout(1800)
              result["checks"]["post_login_lang"] = page.locator("html").get_attribute("lang")
              result["checks"]["post_login_dir"] = page.locator("html").get_attribute("dir")

              # Platform-return regression: entering Seller from a store deep-link
              # must return to the same store/<uuid> route, not just "store".
              page.goto(base + "/#store/" + test_store, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(1000)
              page.evaluate("() => window.openSellerPlatform()")
              page.wait_for_timeout(1400)
              result["checks"]["platform_route_seller_hash"] = page.url.split("#")[-1] == "seller"
              page.evaluate("() => window.closeSellerPlatform()")
              page.wait_for_timeout(1200)
              result["checks"]["platform_return_store_hash"] = page.url.split("#")[-1] == "store/" + test_store
              result["checks"]["platform_return_store_active"] = (
                  "active" in (page.locator("#page-store").get_attribute("class") or "")
                  if page.locator("#page-store").count() else False
              )

              # Regression for the previously reported seller re-entry issue:
              # opening Seller again must work without a page refresh.
              page.evaluate("() => window.openSellerPlatform()")
              page.wait_for_timeout(1200)
              result["checks"]["seller_reentry_hash"] = page.url.split("#")[-1] == "seller"
              result["checks"]["seller_reentry_active"] = (
                  "active" in (page.locator("#sellerPlatform").get_attribute("class") or "")
                  if page.locator("#sellerPlatform").count() else False
              )
              page.evaluate("() => window.closeSellerPlatform()")
              page.wait_for_timeout(1200)
              result["checks"]["seller_reentry_back_store_hash"] = page.url.split("#")[-1] == "store/" + test_store
              result["checks"]["seller_reentry_back_store_active"] = (
                  "active" in (page.locator("#page-store").get_attribute("class") or "")
                  if page.locator("#page-store").count() else False
              )
              page.evaluate("() => { try { closeModal('sellerRegModal') } catch (_) {} }")

              browser.close()

          c = result["checks"]
          failures = []

          required_true = [
              "store_route_active",
              "store_name",
              "store_products_5",
              "shops_store_card",
              "shops_to_store_hash",
              "shops_to_store_active",
              "store_back_button",
              "store_back_to_shops",
              "product_modal_active",
              "product_canonical_hydrated",
              "related_heading",
              "related_excludes_source",
              "product_visit_store_button",
              "product_visit_store_visible",
              "product_visit_store_hit_test_clear",
              "product_visit_store_normal_click_ok",
              "product_visit_store_hash",
              "product_visit_store_active",
              "authenticated_session",
              "authenticated_user_id",
              "arabic_locale_set_ok",
              "platform_route_seller_hash",
              "platform_return_store_hash",
              "platform_return_store_active",
              "seller_reentry_hash",
              "seller_reentry_active",
              "seller_reentry_back_store_hash",
              "seller_reentry_back_store_active",
          ]

          for key in required_true:
              if not c.get(key):
                  failures.append(key)

          if c.get("http_status") != 200:
              failures.append("http_status")

          if c.get("post_login_lang") != "ar":
              failures.append("post_login_lang_not_ar")
          if c.get("post_login_dir") != "rtl":
              failures.append("post_login_dir_not_rtl")

          unexpected_console = [e for e in result["console_errors"] if "401" not in e]
          if unexpected_console:
              failures.append(f"unexpected_console_errors:{len(unexpected_console)}")
          if result["page_errors"]:
              failures.append(f"page_errors:{len(result['page_errors'])}")

          result["passed"] = not failures
          result["failures"] = failures

          with open("browser-local-source-evidence.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(json.dumps(result, ensure_ascii=False, indent=2))
          sys.exit(1 if failures else 0)
          PY

      - name: Upload local browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: velora-local-source-browser-gate
          retention-days: 7
          path: browser-local-source-evidence.json
