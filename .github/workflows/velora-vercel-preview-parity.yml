name: Velora Zero-Cost Vercel Preview Parity Gate

on:
  push:
    branches:
      - audit/runtime-parity-2026-09-28
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional Git SHA to verify; defaults to the workflow commit"
        required: false
        type: string

permissions:
  contents: read

jobs:
  parity:
    name: Vercel status parity for exact Git SHA
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Resolve expected SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ inputs.expected_sha }}"
          if [ -z "$expected" ]; then
            expected="$GITHUB_SHA"
          fi
          echo "EXPECTED_SHA=$expected" >> "$GITHUB_ENV"

      - name: Poll GitHub commit status for Vercel
        shell: python
        run: |
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = "ahmedfayedesmail-ui/velora-marketplace"
          sha = os.environ["EXPECTED_SHA"]
          api = f"https://api.github.com/repos/{repo}/commits/{sha}/status"

          result = {
              "schema": "velora-vercel-preview-parity.v2",
              "repository": repo,
              "expected_sha": sha,
              "status": "PENDING",
              "vercel_status": None,
              "deployment_url": None,
              "deployment_status_url": None,
              "failures": [],
          }

          deadline = time.time() + 300
          last_payload = None

          while time.time() < deadline:
              request = urllib.request.Request(
                  api,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "velora-zero-cost-parity-gate",
                  },
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                      last_payload = payload
              except urllib.error.HTTPError as exc:
                  result["failures"] = ["GITHUB_STATUS_HTTP_" + str(exc.code)]
                  break
              except Exception as exc:
                  result["failures"] = ["GITHUB_STATUS_" + type(exc).__name__]
                  break

              statuses = payload.get("statuses", [])
              vercel = None
              for item in reversed(statuses):
                  if str(item.get("context", "")).strip().lower() == "vercel":
                      vercel = item
                      break

              if vercel:
                  result["vercel_status"] = {
                      "state": vercel.get("state"),
                      "description": vercel.get("description"),
                      "context": vercel.get("context"),
                      "created_at": vercel.get("created_at"),
                      "updated_at": vercel.get("updated_at"),
                  }
                  result["deployment_status_url"] = vercel.get("url")
                  result["deployment_url"] = vercel.get("target_url")

                  if vercel.get("state") == "success":
                      target = str(vercel.get("target_url") or "")
                      if ".vercel.app/" in target or ".vercel.app" in target:
                          result["status"] = "PASS"
                      else:
                          result["status"] = "PASS_WITH_UNVERIFIED_TARGET_HOST"
                      break

                  if vercel.get("state") in {"error", "failure"}:
                      result["status"] = "FAIL"
                      result["failures"] = ["VERCEL_STATUS_" + str(vercel.get("state")).upper()]
                      break

              time.sleep(10)

          if result["status"] == "PENDING":
              result["status"] = "TIMEOUT"
              result["failures"].append("VERCEL_STATUS_NOT_READY_WITHIN_5_MINUTES")

          with open("vercel-preview-parity.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(json.dumps(result, ensure_ascii=False, indent=2))

          if result["status"] == "PENDING":
              raise SystemExit(1)
          if result["status"] == "FAIL":
              raise SystemExit(1)

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-vercel-preview-parity
          path: vercel-preview-parity.json
          retention-days: 3
