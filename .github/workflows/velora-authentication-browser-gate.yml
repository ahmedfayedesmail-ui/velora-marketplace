name: Velora Authentication Browser Gate

on:
  workflow_dispatch:
  push:
    branches:
      - audit/runtime-parity-2026-09-28
    paths:
      - "src/scripts/00-localization.js"
      - "tests/auth-lifecycle-contract.test.mjs"
      - "tools/auth_browser_evidence.py"
      - ".github/workflows/velora-authentication-browser-gate.yml"

permissions:
  contents: read

concurrency:
  group: velora-auth-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-browser:
    name: Autonomous Restore-Test authentication evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://arlaxqmhtvjwjbjinjfw.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_URL: http://127.0.0.1:4173/
      AUTH_EVIDENCE_PATH: auth-browser-evidence.json
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: audit/runtime-parity-2026-09-28
          fetch-depth: 1

      - name: Validate Restore-Test secret
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || {
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not configured."
            exit 1
          }

      - name: Validate authentication evidence runner
        run: |
          python3 -m py_compile tools/auth_browser_evidence.py

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium

      - name: Start exact-source local server
        run: |
          nohup python3 -m http.server 4173 -d src > auth-local-server.log 2>&1 &
          python3 - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:4173/", timeout=2) as r:
                      if r.status == 200:
                          print("local exact-source server ready")
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("LOCAL_EXACT_SOURCE_SERVER_NOT_READY")
          PY

      - name: Run autonomous authentication evidence
        run: python3 tools/auth_browser_evidence.py

      - name: Upload authentication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-authentication-browser-evidence
          path: |
            auth-browser-evidence.json
            auth-local-server.log
          retention-days: 3
