name: Velora Customer Recommendation Exact-Source Browser Gate

on:
  push:
    branches:
      - audit/runtime-parity-2026-09-28
    paths:
      - "src/scripts/59-s1-b2-beauty-recommendations.js"
      - "src/scripts/61-s1-c-quiz-v2.js"
      - ".github/workflows/velora-customer-recommendation-exact-source-browser-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velora-customer-recommendation-exact-source
  cancel-in-progress: true

jobs:
  recommendation-browser:
    name: Passport -> Canonical Recommendations -> Customer UI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: audit/runtime-parity-2026-09-28
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium

      - name: Start exact-source local server
        run: |
          nohup python3 -m http.server 4173 -d src > customer-recommendation-local-server.log 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:4173/", timeout=2) as r:
                      if r.status == 200:
                          print("exact-source local server ready")
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("LOCAL_EXACT_SOURCE_SERVER_NOT_READY")
          PY

      - name: Run exact-source authenticated recommendation Browser evidence
        env:
          APP_URL: http://127.0.0.1:4173
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os, sys
          from playwright.sync_api import sync_playwright

          app = os.environ["APP_URL"].rstrip("/")
          email = os.environ.get("E2E_EMAIL", "")
          password = os.environ.get("E2E_PASSWORD", "")

          evidence = {
              "schema": "customer-recommendation-exact-source-browser.v1",
              "execution_target": "local_exact_source",
              "workflow_sha": os.environ.get("GITHUB_SHA", ""),
              "checks": {},
              "failures": [],
              "browser_errors": [],
          }

          if not email or not password:
              evidence["failures"].append("E2E_CREDENTIALS_MISSING")
              with open("customer-recommendation-browser-evidence.json","w",encoding="utf-8") as f:
                  json.dump(evidence,f,ensure_ascii=False,indent=2)
              print(json.dumps(evidence,ensure_ascii=False,indent=2))
              sys.exit(1)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width":390,"height":844}, locale="en-US")

              rpc_requests = []
              ai_requests = []

              page.on("pageerror", lambda exc: evidence["browser_errors"].append("pageerror:"+str(exc)))
              page.on("console", lambda msg: evidence["browser_errors"].append("console:"+msg.text) if msg.type=="error" else None)
              page.on("request", lambda req: rpc_requests.append(req.url) if "/rest/v1/rpc/velora_get_beauty_recommendations" in req.url else None)
              page.on("request", lambda req: ai_requests.append(req.url) if "velora-beauty-ai-intent" in req.url else None)

              try:
                  response = page.goto(app+"#home", wait_until="domcontentloaded", timeout=60000)
                  evidence["checks"]["http_status"] = response.status if response else None

                  page.evaluate("() => openAuthModal('login')")
                  page.locator("#loginEmail").fill(email)
                  page.locator("#loginPassword").fill(password)
                  page.locator("#authFormContent button[type='submit']").click()
                  page.wait_for_timeout(3500)

                  auth = page.evaluate("""async()=>{
                    const r=await window.mahaSupabase.auth.getSession();
                    return {hasSession:!!r?.data?.session?.user,userId:r?.data?.session?.user?.id||null};
                  }""")
                  evidence["checks"]["authenticated_session"] = bool(auth["hasSession"])

                  if auth["hasSession"]:
                      # Re-enter the canonical Home route after auth; login may leave
                      # the application on its auth transition route/hash.
                      page.goto(app+"#home", wait_until="domcontentloaded", timeout=60000)
                      page.wait_for_timeout(700)
                      passport = page.evaluate("""async()=>{
                        const r=await window.mahaSupabase
                          .from('beauty_profiles')
                          .select('quiz_version,skin_type,goal,routine_budget')
                          .maybeSingle();
                        return r?.data||null;
                      }""")
                      evidence["checks"]["passport_present"] = bool(passport)
                      evidence["checks"]["passport_v2"] = bool(
                          isinstance(passport,dict) and passport.get("quiz_version")=="beauty-quiz.v2"
                      )
                      evidence["checks"]["passport_complete"] = bool(
                          isinstance(passport,dict)
                          and passport.get("skin_type")
                          and passport.get("goal")
                          and passport.get("routine_budget")
                      )

                      page.wait_for_function(
                          "() => { const s=document.getElementById('page-home'); return !!s && s.classList.contains('active'); }",
                          timeout=10000
                      )
                      page.wait_for_timeout(1500)

                      section = page.locator("#veloraBeautyRecommendationsSection")
                      grid = page.locator("#veloraBeautyRecommendationsGrid")
                      status = page.locator("#veloraBeautyRecommendationsStatus")
                      cards = grid.locator(".velora-recommendation-card")
                      reasons = grid.locator(".velora-recommendation-reason")
                      empty = grid.locator(".empty-state")

                      page.evaluate("async()=>{window.__VELORA_RECOMMENDATION_EVIDENCE=await window.veloraBeautyRecommendations.get(); return true;}")
                      page.wait_for_timeout(800)

                      canonical = page.evaluate("() => window.__VELORA_RECOMMENDATION_EVIDENCE || null")
                      evidence["checks"]["recommendation_section_present"] = section.count() == 1
                      evidence["checks"]["recommendation_section_visible"] = section.count() == 1 and section.is_visible()
                      evidence["checks"]["recommendation_rpc_requests"] = len(rpc_requests)
                      evidence["checks"]["ai_endpoint_requests"] = len(ai_requests)
                      evidence["checks"]["canonical_status"] = canonical.get("status") if isinstance(canonical,dict) else None
                      evidence["checks"]["canonical_recommendation_count"] = (
                          len(canonical.get("recommendations",[]))
                          if isinstance(canonical,dict) and isinstance(canonical.get("recommendations"),list)
                          else 0
                      )
                      evidence["checks"]["recommendation_card_count"] = cards.count()
                      evidence["checks"]["reason_chip_count"] = reasons.count()
                      evidence["checks"]["empty_state_visible"] = empty.count()>0 and empty.is_visible()
                      evidence["checks"]["status_text"] = status.inner_text() if status.count() else ""
                      evidence["checks"]["grid_text_length"] = len(grid.inner_text()) if grid.count() else 0

                      page.screenshot(path="customer-recommendation-exact-source.png", full_page=True)

              except Exception as exc:
                  evidence["failures"].append("BROWSER_EXCEPTION:"+str(exc))
              finally:
                  browser.close()

          c=evidence["checks"]
          if c.get("http_status") != 200:
              evidence["failures"].append("LOCAL_SOURCE_HTTP_NOT_200")
          if not c.get("authenticated_session"):
              evidence["failures"].append("AUTHENTICATED_SESSION_MISSING")
          if not c.get("passport_v2"):
              evidence["failures"].append("PASSPORT_V2_MISSING")
          if not c.get("passport_complete"):
              evidence["failures"].append("PASSPORT_INCOMPLETE")
          if not c.get("recommendation_section_present"):
              evidence["failures"].append("RECOMMENDATION_SECTION_MISSING")
          if not c.get("recommendation_section_visible"):
              evidence["failures"].append("RECOMMENDATION_SECTION_NOT_VISIBLE")
          if c.get("recommendation_rpc_requests",0) < 1:
              evidence["failures"].append("CANONICAL_RECOMMENDATION_RPC_NOT_OBSERVED")
          if c.get("ai_endpoint_requests",0) != 0:
              evidence["failures"].append("CUSTOMER_BEAUTY_AI_ENDPOINT_CALLED")
          status=c.get("canonical_status")
          if status not in ("success","ready","incomplete","no_matches","rate_limited"):
              evidence["failures"].append("UNEXPECTED_RECOMMENDATION_STATUS:"+str(status))
          if status in ("success","ready"):
              if c.get("canonical_recommendation_count",0) < 1:
                  evidence["failures"].append("CANONICAL_RECOMMENDATIONS_EMPTY")
              if c.get("recommendation_card_count",0) < 1:
                  evidence["failures"].append("RECOMMENDATION_CARDS_NOT_RENDERED")
              if c.get("reason_chip_count",0) < 1:
                  evidence["failures"].append("REASON_CHIPS_NOT_RENDERED")
          elif status in ("incomplete","no_matches","rate_limited"):
              if not c.get("empty_state_visible"):
                  evidence["failures"].append("CUSTOMER_FALLBACK_STATE_NOT_RENDERED")

          evidence["browser_errors"] = list(dict.fromkeys(evidence["browser_errors"]))[:50]
          evidence["checks"]["browser_error_count"] = len(evidence["browser_errors"])
          evidence["passed"] = not evidence["failures"] and not evidence["browser_errors"]

          with open("customer-recommendation-browser-evidence.json","w",encoding="utf-8") as f:
              json.dump(evidence,f,ensure_ascii=False,indent=2)
          print(json.dumps(evidence,ensure_ascii=False,indent=2))
          sys.exit(0 if evidence["passed"] else 1)
          PY

      - name: Upload exact-source Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-recommendation-exact-source-browser-evidence
          path: |
            customer-recommendation-browser-evidence.json
            customer-recommendation-exact-source.png
            customer-recommendation-local-server.log
          retention-days: 7
