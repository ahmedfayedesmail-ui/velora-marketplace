name: Velora Staff Launch Gate Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/full-gate-2026-09-25

permissions:
  contents: read

jobs:
  staff-launch-gate-audit:
    name: Staff-authenticated canonical launch-gate audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/full-gate-2026-09-25

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium

      - name: Execute canonical launch-gate audit from authorized staff browser session
        env:
          PREVIEW_URL: https://velora-marketplace-5nv2ooto7-ahmedconccc-7063.vercel.app/
          TESTED_PREVIEW_SHA: 795fa13609558c7ccf2a20456e56bf4808e1c677
          STAFF_E2E_EMAIL: ${{ secrets.STAFF_E2E_EMAIL }}
          STAFF_E2E_PASSWORD: ${{ secrets.STAFF_E2E_PASSWORD }}
          SUPABASE_URL: https://arlaxqmhtvjwjbjinjfw.supabase.co
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from playwright.sync_api import sync_playwright

          url = os.environ["PREVIEW_URL"].rstrip("/")
          email = os.environ.get("STAFF_E2E_EMAIL", "")
          password = os.environ.get("STAFF_E2E_PASSWORD", "")

          result = {
              "schema": "velora_staff_launch_gate_audit_v1",
              "preview_url": url,
              "tested_preview_sha": os.environ.get("TESTED_PREVIEW_SHA", ""),
              "github_workflow_run_id": int(os.environ.get("GITHUB_RUN_ID", "0") or 0),
              "github_workflow_sha": os.environ.get("GITHUB_SHA", ""),
              "checks": {},
              "rpc": {},
              "page_errors": [],
              "console_errors": [],
          }

          if not email or not password:
              result["checks"]["staff_secrets_present"] = False
              result["failures"] = ["Missing STAFF_E2E_EMAIL/STAFF_E2E_PASSWORD repository secrets"]
              with open("staff-launch-gate-audit.json", "w", encoding="utf-8") as f:
                  json.dump(result, f, ensure_ascii=False, indent=2)
              print(json.dumps(result, ensure_ascii=False, indent=2))
              sys.exit(1)

          result["checks"]["staff_secrets_present"] = True

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1000}, locale="en-US")
              page.on("pageerror", lambda e: result["page_errors"].append(str(e)))
              page.on(
                  "console",
                  lambda m: result["console_errors"].append(m.text)
                  if m.type == "error" else None
              )

              response = page.goto(
                  url + "/#home",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )
              result["checks"]["http_status"] = response.status if response else None
              result["checks"]["title"] = page.title()

              page.evaluate("() => openAuthModal('login')")
              page.locator("#loginEmail").fill(email)
              page.locator("#loginPassword").fill(password)
              page.locator("#authFormContent button[type='submit']").click()
              page.wait_for_timeout(800)
              page.wait_for_timeout(3200)

              auth = page.evaluate("""
                async () => {
                  try {
                    const r = await window.mahaSupabase.auth.getSession();
                    return {
                      ok: !r?.error,
                      hasSession: !!r?.data?.session?.user,
                      userId: r?.data?.session?.user?.id || null
                    };
                  } catch (e) {
                    return { ok: false, hasSession: false, userId: null, error: String(e?.message || e) };
                  }
                }
              """)
              result["checks"]["authenticated_session"] = bool(auth.get("hasSession"))
              result["checks"]["authenticated_user_id_present"] = bool(auth.get("userId"))

              if not auth.get("hasSession"):
                  result["failures"] = ["Staff browser session was not created; canonical launch-gate audit was not attempted."]
                  result["passed"] = False
                  browser.close()
                  with open("staff-launch-gate-audit.json", "w", encoding="utf-8") as f:
                      json.dump(result, f, ensure_ascii=False, indent=2)
                  print(json.dumps(result, ensure_ascii=False, indent=2))
                  sys.exit(1)

              staff_probe = page.evaluate("""
                async () => {
                  try {
                    if (!window.mahaSupabase?.rpc) {
                      return { ok: false, error: "SUPABASE_CLIENT_UNAVAILABLE" };
                    }
                    const r = await window.mahaSupabase.rpc("velora_is_staff");
                    return {
                      ok: !r?.error && r?.data === true,
                      data: r?.data ?? null,
                      error: r?.error ? String(r.error.message || r.error) : null
                    };
                  } catch (e) {
                    return { ok: false, error: String(e?.message || e) };
                  }
                }
              """)
              result["rpc"]["velora_is_staff"] = staff_probe

              if not staff_probe.get("ok"):
                  result["failures"] = [
                      "Authenticated account did not prove velora_is_staff()=true; canonical launch-gate audit was not attempted."
                  ]
                  result["passed"] = False
                  browser.close()
                  with open("staff-launch-gate-audit.json", "w", encoding="utf-8") as f:
                      json.dump(result, f, ensure_ascii=False, indent=2)
                  print(json.dumps(result, ensure_ascii=False, indent=2))
                  sys.exit(1)

              audit = page.evaluate("""
                async () => {
                  try {
                    const r = await window.mahaSupabase.rpc("velora_run_launch_gate_audit");
                    return {
                      ok: !r?.error,
                      data: r?.data ?? null,
                      error: r?.error ? String(r.error.message || r.error) : null
                    };
                  } catch (e) {
                    return { ok: false, error: String(e?.message || e) };
                  }
                }
              """)
              result["rpc"]["velora_run_launch_gate_audit"] = audit

              control = page.evaluate("""
                async () => {
                  try {
                    const r = await window.mahaSupabase.rpc("velora_get_launch_control_plane");
                    return {
                      ok: !r?.error,
                      data: r?.data ?? null,
                      error: r?.error ? String(r.error.message || r.error) : null
                    };
                  } catch (e) {
                    return { ok: false, error: String(e?.message || e) };
                  }
                }
              """)
              result["rpc"]["velora_get_launch_control_plane"] = control

              result["checks"]["launch_gate_audit_rpc_ok"] = bool(audit.get("ok"))
              result["checks"]["launch_control_plane_read_ok"] = bool(control.get("ok"))

              browser.close()

          failures = []
          if result["checks"].get("http_status") != 200:
              failures.append("Preview HTTP status is not 200")
          if not result["checks"].get("authenticated_session"):
              failures.append("Authenticated staff session was not created")
          if not result["checks"].get("launch_gate_audit_rpc_ok"):
              failures.append("velora_run_launch_gate_audit() did not succeed")
          if not result["checks"].get("launch_control_plane_read_ok"):
              failures.append("velora_get_launch_control_plane() did not succeed")
          if result["page_errors"]:
              failures.append(f"page errors: {len(result['page_errors'])}")

          result["passed"] = not failures
          result["failures"] = failures

          with open("staff-launch-gate-audit.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(json.dumps(result, ensure_ascii=False, indent=2))
          sys.exit(1 if failures else 0)
          PY

      - name: Upload staff launch-gate audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: velora-staff-launch-gate-audit
          retention-days: 7
          path: staff-launch-gate-audit.json
