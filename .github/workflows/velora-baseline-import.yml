name: Velora Baseline Import

on:
  push:
    branches: [velora-baseline]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: velora-baseline

      - name: Check ready marker
        id: ready
        shell: bash
        run: |
          if [ -f .velora-import/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild and validate archive
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/velora-import
          cat .velora-import/part-*.b64 | tr -cd 'A-Za-z0-9+/=\n' | base64 -d -i > /tmp/velora-import/Velora_REBUILD_v0.1.tar.gz
          test "$(stat -c%s /tmp/velora-import/Velora_REBUILD_v0.1.tar.gz)" -gt 100000
          mkdir -p /tmp/velora-import/extracted
          tar -xzf /tmp/velora-import/Velora_REBUILD_v0.1.tar.gz -C /tmp/velora-import/extracted
          test -d /tmp/velora-import/extracted/Velora_REBUILD
          COUNT=$(find /tmp/velora-import/extracted/Velora_REBUILD -type f | wc -l)
          test "$COUNT" -eq 62

      - name: Replace branch contents with authoritative baseline
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "velora-import-bot"
          git config user.email "velora-import-bot@users.noreply.github.com"
          git ls-files -z | xargs -0 -r git rm -f
          cp -a /tmp/velora-import/extracted/Velora_REBUILD/. .
          rm -rf .velora-import .github/workflows/velora-baseline-import.yml Velora_REBUILD
          git add -A
          COUNT=$(git ls-files | wc -l)
          test "$COUNT" -eq 62
          git diff --cached --quiet && exit 0
          git commit -m "Import Velora_REBUILD_v0.1 authoritative baseline"
          git push origin HEAD:velora-baseline
