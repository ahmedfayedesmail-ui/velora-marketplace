name: Velora Authenticated Browser Gate

on:
  workflow_dispatch:
  push:
    branches:
      - audit/full-gate-2026-09-25

permissions:
  contents: read

jobs:
  authenticated-browser:
    name: Authenticated Browser -> Canonical E2E evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/full-gate-2026-09-25

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium

      - name: Run authenticated browser evidence
        env:
          PREVIEW_URL: https://velora-marketplace-git-audit-full-gate-c558d2-ahmedconccc-7063.vercel.app/
          TESTED_PREVIEW_SHA: ${{ github.sha }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os, sys
          from playwright.sync_api import sync_playwright

          url = os.environ["PREVIEW_URL"].rstrip("/")
          email = os.environ.get("E2E_EMAIL", "")
          password = os.environ.get("E2E_PASSWORD", "")
          test_product = "21d977a0-111b-4bb4-9736-0f2994294d48"
          test_store = "11111111-2222-4333-8444-555555555555"

          result = {
              "browser_evidence_schema": "v1",
              "preview_url": url,
              "tested_preview_sha": os.environ.get("TESTED_PREVIEW_SHA", ""),
              "github_workflow_run_id": int(os.environ.get("GITHUB_RUN_ID", "0") or 0),
              "github_workflow_sha": os.environ.get("GITHUB_SHA", ""),
              "checks": {},
              "console_errors": [],
              "page_errors": [],
          }

          if not email or not password:
              result["checks"]["secrets_present"] = False
              result["failures"] = ["Missing E2E_EMAIL/E2E_PASSWORD repository secrets"]
              with open("browser-auth-cart-evidence.json", "w", encoding="utf-8") as f:
                  json.dump(result, f, ensure_ascii=False, indent=2)
              print(json.dumps(result, ensure_ascii=False, indent=2))
              sys.exit(1)

          result["checks"]["secrets_present"] = True

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1000}, locale="en-US")

              page.on(
                  "console",
                  lambda m: result["console_errors"].append(m.text)
                  if m.type == "error" else None
              )
              page.on("pageerror", lambda e: result["page_errors"].append({"message": str(e), "stack": getattr(e, "stack", None)}))

              auth_token_responses = []
              response_statuses = []

              def on_response(response):
                  entry = {"status": response.status, "url": response.url}
                  response_statuses.append(entry)
                  if "/auth/v1/token" in response.url:
                      auth_token_responses.append({
                          "status": response.status,
                          "url_path": response.url.split("/auth/v1/")[-1].split("?")[0]
                      })

              page.on("response", on_response)

              response = page.goto(
                  url + "/#home",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              result["checks"]["http_status"] = response.status if response else None
              result["checks"]["title"] = page.title()
              result["checks"]["initial_lang"] = page.locator("html").get_attribute("lang")
              result["checks"]["initial_dir"] = page.locator("html").get_attribute("dir")

              # Anonymous discovery gates: Store Detail route + Product Detail related section.
              page.goto(
                  url + "/#store/" + test_store,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )
              page.wait_for_timeout(1800)
              store_text = page.locator("#storeDetailContent").inner_text() if page.locator("#storeDetailContent").count() else ""
              result["checks"]["store_detail_route_active"] = (
                  "active" in (page.locator("#page-store").get_attribute("class") or "")
                  if page.locator("#page-store").count() else False
              )
              result["checks"]["store_detail_has_store_name"] = "E2E Seller Store" in store_text
              result["checks"]["store_detail_has_test_product"] = "Test Vitamin C Serum" in store_text
              result["checks"]["store_detail_product_count"] = sum(
                  1 for name in (
                      "Test Vitamin C Serum",
                      "QA Seed Anti-Aging Treatment",
                      "QA Seed Barrier Moisturizer",
                      "QA Seed Cleanser",
                      "QA Seed SPF 50 Protect",
                  ) if name in store_text
              )

              # Customer navigation gate: Shops -> Visit Store -> Back to Shops.
              page.goto(
                  url + "/#shops",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )
              page.wait_for_timeout(1600)
              shops_store_card = page.locator(".velora-store-card").filter(has_text="E2E Seller Store").first
              result["checks"]["shops_rendered_expected_store_card"] = shops_store_card.count() == 1
              if shops_store_card.count() == 1:
                  shops_store_card.locator("button").first.click()
                  page.wait_for_timeout(1600)
              result["checks"]["shops_visit_store_hash"] = page.url.split("#")[-1] == "store/" + test_store
              result["checks"]["shops_visit_store_active"] = (
                  "active" in (page.locator("#page-store").get_attribute("class") or "")
                  if page.locator("#page-store").count() else False
              )
              result["checks"]["shops_visit_store_rendered"] = (
                  "E2E Seller Store" in (
                      page.locator("#storeDetailContent").inner_text()
                      if page.locator("#storeDetailContent").count() else ""
                  )
              )
              back_to_shops = page.locator("#storeDetailContent button").filter(has_text="Back to Shops").first
              result["checks"]["store_back_to_shops_button"] = back_to_shops.count() == 1
              if back_to_shops.count() == 1:
                  back_to_shops.click()
                  page.wait_for_timeout(800)
              result["checks"]["store_back_to_shops_active"] = (
                  "active" in (page.locator("#page-shops").get_attribute("class") or "")
                  if page.locator("#page-shops").count() else False
              )
              result["checks"]["store_back_to_shops_hash"] = page.url.split("#")[-1] == "shops"

              page.goto(
                  url + "/#shop",
                  wait_until="domcontentloaded",
                  timeout=60000,
              )
              page.wait_for_timeout(1000)
              result["checks"]["product_detail_open_product_function_source"] = page.evaluate(
                  "() => String(window.openProductDetail || '').slice(0, 180)"
              )
              fn_diag = page.evaluate(
                  """() => {
                      const fn = window.openProductDetail;
                      const src = typeof fn === "function" ? Function.prototype.toString.call(fn) : String(fn);
                      return {
                          type: typeof fn,
                          name: typeof fn === "function" ? fn.name : null,
                          hasCanonicalRpc: src.includes("velora_get_product_detail"),
                          hasHydratedMarker: src.includes("_veloraDetailHydrated"),
                          hasOriginalCall: src.includes("originalOpenProductDetail"),
                          sourcePrefix: src.slice(0, 700),
                      };
                  }"""
              )
              result["checks"]["open_product_detail_runtime_source"] = fn_diag
              before_product = page.evaluate(
                  """(productId) => {
                      const p = (window.MAHA_DATA?.PRODUCTS || []).find(x => x.id === productId);
                      return p ? {
                          storeId: p.storeId || null,
                          storeName: p.storeName || null,
                          hydrated: p._veloraDetailHydrated === true,
                      } : null;
                  }""",
                  test_product,
              )
              result["checks"]["product_detail_before_product_state"] = before_product
              rpc_diag = page.evaluate(
                  """async (productId) => {
                      const db = window.mahaSupabase;
                      if (!db?.rpc) return {error: "supabase_unavailable"};
                      const ctx = window.VELORA_MARKET_CONTEXT || {};
                      const r = await db.rpc("velora_get_product_detail", {
                          p_product_id: productId,
                          p_country_code: ctx.countryCode || null,
                          p_currency_code: ctx.currencyCode || null,
                      });
                      return {
                          error: r.error ? String(r.error.message || r.error) : null,
                          rowCount: Array.isArray(r.data) ? r.data.length : (r.data ? 1 : 0),
                          storeId: r.data?.[0]?.store_id || null,
                      };
                  }""",
                  test_product,
              )
              result["checks"]["product_detail_rpc_diag"] = rpc_diag
              page.evaluate("(productId) => window.openProductDetail(productId)", test_product)
              page.wait_for_timeout(1600)
              after_product = page.evaluate(
                  """(productId) => {
                      const p = (window.MAHA_DATA?.PRODUCTS || []).find(x => x.id === productId);
                      return p ? {
                          storeId: p.storeId || null,
                          storeName: p.storeName || null,
                          hydrated: p._veloraDetailHydrated === true,
                      } : null;
                  }""",
                  test_product,
              )
              result["checks"]["product_detail_after_product_state"] = after_product
              detail_text = page.locator("#productModalContent").inner_text() if page.locator("#productModalContent").count() else ""
              result["checks"]["product_detail_modal_active"] = (
                  "active" in (page.locator("#productModal").get_attribute("class") or "")
                  if page.locator("#productModal").count() else False
              )
              result["checks"]["product_detail_has_related_heading"] = "You May Also Like" in detail_text
              result["checks"]["product_detail_related_excludes_source"] = (
                  detail_text.count("Test Vitamin C Serum") == 1
              )

              # Product Detail -> Visit Store must land on the same canonical store route.
              product_store_button = page.locator("#productModalContent button").filter(has_text="Visit Store").first
              result["checks"]["product_detail_has_visit_store_button"] = product_store_button.count() == 1
              result["checks"]["product_detail_visit_store_visible"] = (
                  product_store_button.is_visible() if product_store_button.count() == 1 else False
              )
              result["checks"]["product_detail_visit_store_hit_test_clear"] = False
              if product_store_button.count() == 1 and product_store_button.is_visible():
                  box = product_store_button.bounding_box()
                  if box and box["width"] > 0 and box["height"] > 0:
                      hit = page.evaluate(
                          """({x, y}) => {
                              const el = document.elementFromPoint(x, y);
                              const button = document.querySelector("#productModalContent button");
                              return !!(el && button && (el === button || button.contains(el)));
                          }""",
                          {"x": box["x"] + box["width"] / 2, "y": box["y"] + box["height"] / 2},
                      )
                      result["checks"]["product_detail_visit_store_hit_test_clear"] = bool(hit)
                  # The click handler itself is deterministic; force only bypasses a separate
                  # overlay/hit-test issue so the route handler can still be verified.
                  product_store_button.click(force=True)
                  page.wait_for_timeout(1600)
              result["checks"]["product_detail_visit_store_hash"] = page.url.split("#")[-1] == "store/" + test_store
              result["checks"]["product_detail_visit_store_active"] = (
                  "active" in (page.locator("#page-store").get_attribute("class") or "")
                  if page.locator("#page-store").count() else False
              )

              # Test isolation: close the product modal before opening auth.
              page.evaluate("() => closeModal('productModal')")
              result["checks"]["product_detail_modal_closed_before_auth"] = (
                  "active" not in (page.locator("#productModal").get_attribute("class") or "")
                  if page.locator("#productModal").count() else True
              )

              page.evaluate("() => openAuthModal('login')")
              page.locator("#loginEmail").fill(email)
              page.locator("#loginPassword").fill(password)
              page.locator("#authFormContent button[type='submit']").click()

              page.wait_for_timeout(800)
              result["checks"]["login_toast_text_immediate"] = (
                  page.locator("#toast").inner_text()
                  if page.locator("#toast").count() else ""
              )
              page.wait_for_timeout(2800)

              auth = page.evaluate("""
                async () => {
                  const result = { hasSession: false, userId: null };
                  try {
                    const r = await window.mahaSupabase.auth.getSession();
                    result.hasSession = !!r?.data?.session?.user;
                    result.userId = r?.data?.session?.user?.id || null;
                  } catch (_) {}
                  return result;
                }
              """)

              result["checks"]["auth_token_response_statuses"] = auth_token_responses
              result["checks"]["authenticated_session"] = auth["hasSession"]
              result["checks"]["authenticated_user_id_present"] = bool(auth["userId"])
              result["checks"]["state_user_present"] = bool(
                  page.evaluate("() => typeof STATE !== 'undefined' && !!STATE.user")
              )

              locale_result = page.evaluate("""
                async () => {
                  try {
                    const fn = window.VELORA_V5_SET_LANGUAGE;
                    if (typeof fn !== 'function') return { ok: false, reason: "V5_SET_LANGUAGE_UNAVAILABLE" };
                    return { ok: !!(await fn('ar')) };
                  } catch (e) {
                    return { ok: false, reason: String(e?.message || e) };
                  }
                }
              """)

              result["checks"]["arabic_locale_set_ok"] = bool(locale_result.get("ok"))
              page.wait_for_timeout(1800)
              result["checks"]["post_login_lang"] = page.locator("html").get_attribute("lang")
              result["checks"]["post_login_dir"] = page.locator("html").get_attribute("dir")

              if not auth["hasSession"]:
                  result["checks"]["auth_modal_active"] = (
                      "active" in (page.locator("#authModal").get_attribute("class") or "")
                      if page.locator("#authModal").count() else None
                  )
                  result["passed"] = False
                  result["failures"] = ["Authenticated Supabase session was not created"]
                  browser.close()
                  with open("browser-auth-cart-evidence.json", "w", encoding="utf-8") as f:
                      json.dump(result, f, ensure_ascii=False, indent=2)
                  print(json.dumps(result, ensure_ascii=False, indent=2))
                  sys.exit(1)

              page.evaluate("() => navigateTo('shop')")
              page.wait_for_timeout(1200)
              page.evaluate("(productId) => window.addToCart(productId, 1)", test_product)
              page.wait_for_timeout(3000)

              cloud_sync = page.evaluate("""
                async () => {
                  try {
                    if (typeof window.veloraSyncCloudCart !== 'function') {
                      return { ok: false, reason: "SYNC_API_UNAVAILABLE" };
                    }
                    return { ok: await window.veloraSyncCloudCart() };
                  } catch (e) {
                    return { ok: false, reason: String(e?.message || e) };
                  }
                }
              """)

              result["checks"]["canonical_cart_sync_ok"] = bool(cloud_sync.get("ok"))

              local_cart = page.evaluate("""
                (productId) => {
                  const cart = (typeof STATE !== 'undefined' && Array.isArray(STATE.cart)) ? STATE.cart : [];
                  const item = cart.find(x =>
                    String(x?.canonicalId || x?.productId || x?.id || "") === productId
                  );
                  return {
                    count: cart.reduce((n, x) => n + Number(x?.quantity || 0), 0),
                    hasProduct: !!item,
                    quantity: Number(item?.quantity || 0)
                  };
                }
              """, test_product)

              result["checks"]["local_cart_has_test_product"] = local_cart["hasProduct"]
              result["checks"]["local_cart_test_quantity"] = local_cart["quantity"]
              result["checks"]["local_cart_count"] = local_cart["count"]

              page.evaluate("() => navigateTo('checkout')")
              page.wait_for_timeout(6000)

              checkout = page.locator("#page-checkout").inner_text()
              result["checks"]["checkout_has_product"] = "Test Vitamin C Serum" in checkout
              result["checks"]["checkout_has_shipping_ar_after_login"] = "معلومات الشحن" in checkout
              result["checks"]["checkout_has_payment_ar_after_login"] = "طريقة الدفع" in checkout
              result["checks"]["checkout_has_summary_ar_after_login"] = "ملخص الطلب" in checkout
              result["checks"]["checkout_has_place_order_ar_after_login"] = "إتمام الطلب" in checkout
              result["checks"]["checkout_has_empty_state"] = (
                  "Your cart is empty" in checkout or "سلة التسوق فارغة" in checkout
              )

              session_after = page.evaluate("""
                async () => {
                  try {
                    const r = await window.mahaSupabase.auth.getSession();
                    return !!r?.data?.session?.user;
                  } catch (_) {
                    return false;
                  }
                }
              """)

              result["checks"]["session_survived_checkout_navigation"] = bool(session_after)
              result["checks"]["response_403_urls"] = [x["url"] for x in response_statuses if x["status"] == 403]
              result["checks"]["response_406_urls"] = [x["url"] for x in response_statuses if x["status"] == 406]
              result["checks"]["response_error_urls"] = [x for x in response_statuses if x["status"] >= 400]

              browser.close()

          failures = []
          c = result["checks"]

          if c.get("http_status") != 200:
              failures.append("HTTP status is not 200")
          if not c.get("store_detail_route_active"):
              failures.append("Store Detail route did not activate")
          if not c.get("store_detail_has_store_name"):
              failures.append("Store Detail did not render the canonical store")
          if not c.get("store_detail_has_test_product"):
              failures.append("Store Detail did not render the test product")
          if c.get("store_detail_product_count") != 5:
              failures.append("Store Detail did not render all 5 expected QA products")
          if not c.get("shops_rendered_expected_store_card"):
              failures.append("Shops did not render the expected E2E Seller Store card")
          if not c.get("shops_visit_store_hash"):
              failures.append("Shops -> Visit Store did not reach the canonical store hash")
          if not c.get("shops_visit_store_active"):
              failures.append("Shops -> Visit Store did not activate Store Detail")
          if not c.get("shops_visit_store_rendered"):
              failures.append("Shops -> Visit Store did not render the canonical store")
          if not c.get("store_back_to_shops_button"):
              failures.append("Store Detail did not render Back to Shops")
          if not c.get("store_back_to_shops_active"):
              failures.append("Back to Shops did not activate Shops")
          if not c.get("store_back_to_shops_hash"):
              failures.append("Back to Shops did not restore the shops hash")
          if not c.get("product_detail_modal_active"):
              failures.append("Product Detail modal did not activate")
          if not c.get("product_detail_has_related_heading"):
              failures.append("Product Detail did not render Related Products")
          if not c.get("product_detail_has_visit_store_button"):
              failures.append("Product Detail did not render Visit Store")
          if not c.get("product_detail_visit_store_visible"):
              failures.append("Product Detail Visit Store control is not visible")
          if not c.get("product_detail_visit_store_hit_test_clear"):
              failures.append("Product Detail Visit Store center point is obstructed by another element")
          if not c.get("product_detail_visit_store_hash"):
              failures.append("Product Detail -> Visit Store did not reach the canonical store hash")
          if not c.get("product_detail_visit_store_active"):
              failures.append("Product Detail -> Visit Store did not activate Store Detail")
          if not c.get("product_detail_related_excludes_source"):
              failures.append("Related Products section may contain the source product")

          if not c.get("authenticated_session"):
              failures.append("Authenticated Supabase session was not created")
          if not c.get("state_user_present"):
              failures.append("Application STATE.user was not populated after login")
          if not c.get("canonical_cart_sync_ok"):
              failures.append("Canonical cloud cart sync did not return true")
          if not c.get("local_cart_has_test_product"):
              failures.append("Test product was not present in local cart state")
          if c.get("local_cart_test_quantity", 0) < 1:
              failures.append("Test product quantity is less than 1")
          if c.get("checkout_has_empty_state"):
              failures.append("Checkout rendered an empty-cart state")
          if not c.get("checkout_has_product"):
              failures.append("Checkout did not render the test product")
          if not c.get("session_survived_checkout_navigation"):
              failures.append("Authenticated session did not survive checkout navigation")
          for key in (
              "checkout_has_shipping_ar_after_login",
              "checkout_has_payment_ar_after_login",
              "checkout_has_summary_ar_after_login",
              "checkout_has_place_order_ar_after_login",
          ):
              if not c.get(key):
                  failures.append(key)

          unexpected_console = [e for e in result["console_errors"] if "401" not in e]
          if unexpected_console:
              failures.append(f"unexpected console errors: {len(unexpected_console)}")
          if result["page_errors"]:
              failures.append(f"page errors: {len(result['page_errors'])}")

          result["passed"] = not failures
          result["failures"] = failures

          with open("browser-auth-cart-evidence.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(json.dumps(result, ensure_ascii=False, indent=2))
          sys.exit(1 if failures else 0)
          PY

      - name: Record browser evidence in canonical E2E gate
        if: always()
        env:
          SUPABASE_URL: https://arlaxqmhtvjwjbjinjfw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not configured; browser artifact remains evidence-only."
            exit 0
          fi
          if [[ ! -f browser-auth-cart-evidence.json ]]; then
            echo "::warning::Browser evidence file was not produced; nothing to ingest."
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request

          with open("browser-auth-cart-evidence.json", "r", encoding="utf-8") as f:
              evidence = json.load(f)

          status = "passed" if evidence.get("passed") is True else "failed"

          payload = {
              "p_workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "p_commit_sha": evidence["tested_preview_sha"],
              "p_preview_url": evidence["preview_url"],
              "p_status": status,
              "p_evidence": evidence,
          }

          data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              os.environ["SUPABASE_URL"] + "/rest/v1/rpc/velora_record_browser_e2e_evidence",
              data=data,
              headers={
                  "apikey": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
                  "Authorization": "Bearer " + os.environ["SUPABASE_SERVICE_ROLE_KEY"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.read().decode("utf-8"))
          PY

      - name: Upload authenticated browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: velora-authenticated-browser-gate
          retention-days: 7
          path: browser-auth-cart-evidence.json
