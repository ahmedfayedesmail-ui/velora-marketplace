name: Velora Zero-Cost Inventory Failure Lab

on:
  push:
    branches:
      - audit/runtime-parity-2026-09-28
    paths:
      - "tools/velora_inventory_failure_reconciliation_lab.py"
      - ".github/workflows/velora-zero-cost-inventory-failure-lab.yml"
      - ".remote/inventory-failure-lab.json"
      - "src/scripts/13-payments.js"
      - "src/scripts/71-customer-orders-returns.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: Deterministic Inventory Failure Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: audit/runtime-parity-2026-09-28
          fetch-depth: 1
      - name: Run dependency-free inventory failure lab
        run: python3 tools/velora_inventory_failure_reconciliation_lab.py
      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/scripts/13-payments.js
          node --check src/scripts/71-customer-orders-returns.js
      - name: Publish summary
        if: always()
        run: |
          cat zero-cost-inventory-failure-lab.json >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-zero-cost-inventory-failure-lab
          path: zero-cost-inventory-failure-lab.json
          retention-days: 3
