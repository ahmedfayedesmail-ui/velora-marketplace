name: Velora Paymob Sandbox Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - audit/full-gate-2026-09-25
    paths:
      - "evidence/paymob-sandbox-evidence.trigger"

permissions:
  contents: read

concurrency:
  group: velora-paymob-sandbox-evidence
  cancel-in-progress: false

jobs:
  paymob-sandbox-evidence:
    name: Paymob sandbox -> Intention -> Checkout -> Webhook evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/full-gate-2026-09-25

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium

      - name: Run Paymob sandbox evidence drill
        env:
          SUPABASE_URL: https://arlaxqmhtvjwjbjinjfw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_RDyqYgvJyT37RiQ1PNxYuQ_ov_8eceA
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          xvfb-run -a python - <<'PY'
          import json
          import os
          import sys
          import time
          import uuid
          import urllib.parse
          import urllib.request
          import re
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          base = os.environ["SUPABASE_URL"].rstrip("/")
          publishable_key = os.environ["SUPABASE_PUBLISHABLE_KEY"]
          email = os.environ.get("E2E_EMAIL", "")
          password = os.environ.get("E2E_PASSWORD", "")
          service_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")

          evidence = {
              "schema": "paymob-sandbox-evidence-v1",
              "environment": "restore-test",
              "provider": "paymob",
              "mode": "sandbox",
              "workflow_run_id": int(os.environ.get("GITHUB_RUN_ID", "0") or 0),
              "workflow_sha": os.environ.get("GITHUB_SHA", ""),
              "checks": {},
              "playwright": {},
              "db": {},
              "failures": [],
          }

          def http_json(method, url, body=None, headers=None):
              data = None
              h = dict(headers or {})
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  h.setdefault("Content-Type", "application/json")
              req = urllib.request.Request(url, method=method, data=data, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode("utf-8")
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  try:
                      payload = json.loads(raw) if raw else {}
                  except Exception:
                      payload = {"raw": raw[:500]}
                  return exc.code, payload

          if not email or not password:
              evidence["failures"].append("E2E_EMAIL/E2E_PASSWORD repository secrets are missing")
          if not service_key:
              evidence["failures"].append("SUPABASE_SERVICE_ROLE_KEY repository secret is missing")
          if evidence["failures"]:
              Path("paymob-sandbox-evidence.json").write_text(json.dumps(evidence, ensure_ascii=False, indent=2), encoding="utf-8")
              print(json.dumps(evidence, ensure_ascii=False, indent=2))
              sys.exit(1)

          # Authenticate the owned E2E account.
          status, auth = http_json(
              "POST",
              f"{base}/auth/v1/token?grant_type=password",
              {"email": email, "password": password},
              {"apikey": publishable_key},
          )
          access_token = auth.get("access_token", "")
          user_id = (auth.get("user") or {}).get("id", "")
          evidence["checks"]["auth_http_200"] = status == 200
          evidence["checks"]["authenticated_user"] = bool(access_token and user_id)
          if not access_token or not user_id:
              evidence["failures"].append("Authenticated Supabase session was not returned")

          # Find the latest pending order owned by the authenticated test account.
          # If none exists, create a Restore-Test fixture through the canonical authenticated order RPC.
          order = None
          if access_token and user_id:
              auth_headers = {
                  "apikey": publishable_key,
                  "Authorization": f"Bearer {access_token}",
              }

              query = urllib.parse.urlencode({
                  "customer_id": f"eq.{user_id}",
                  "status": "eq.pending",
                  "payment_status": "eq.pending",
                  "select": "id,order_number,total,currency,status,payment_status,created_at",
                  "order": "created_at.desc",
                  "limit": "1",
              }, safe=",")

              req = urllib.request.Request(
                  f"{base}/rest/v1/orders?{query}",
                  method="GET",
                  headers=auth_headers,
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      rows = json.loads(resp.read().decode("utf-8"))
                  order = rows[0] if rows else None
              except Exception as exc:
                  evidence["failures"].append(
                      f"Pending-order lookup failed: {type(exc).__name__}"
                  )

              if not order:
                  product_query = urllib.parse.urlencode({
                      "status": "eq.approved",
                      "select": "id,name,stock,currency_code,price",
                      "order": "created_at.desc",
                      "limit": "20",
                  }, safe=",")

                  product_req = urllib.request.Request(
                      f"{base}/rest/v1/products?{product_query}",
                      method="GET",
                      headers=auth_headers,
                  )

                  try:
                      with urllib.request.urlopen(product_req, timeout=30) as resp:
                          products = json.loads(resp.read().decode("utf-8"))
                  except Exception as exc:
                      products = []
                      evidence["failures"].append(
                          f"Approved product lookup failed: {type(exc).__name__}"
                      )

                  fixture = None
                  for product in products:
                      variants_query = urllib.parse.urlencode({
                          "product_id": f"eq.{product['id']}",
                          "is_active": "eq.true",
                          "select": "id,name,stock_quantity",
                          "order": "created_at.asc",
                          "limit": "5",
                      }, safe=",")

                      variants_req = urllib.request.Request(
                          f"{base}/rest/v1/product_variants?{variants_query}",
                          method="GET",
                          headers=auth_headers,
                      )

                      try:
                          with urllib.request.urlopen(variants_req, timeout=30) as resp:
                              variants = json.loads(resp.read().decode("utf-8"))
                      except Exception:
                          variants = []

                      available_variants = [
                          v for v in variants
                          if int(v.get("stock_quantity") or 0) > 0
                      ]

                      if available_variants:
                          fixture = {
                              "product_id": product["id"],
                              "product_variant_id": available_variants[0]["id"],
                              "quantity": 1,
                          }
                          break

                      if not variants and int(product.get("stock") or 0) > 0:
                          fixture = {
                              "product_id": product["id"],
                              "quantity": 1,
                          }
                          break

                  if fixture:
                      fixture_items = [fixture]

                      quote_status, quote = http_json(
                          "POST",
                          f"{base}/rest/v1/rpc/velora_quote_cart_shipping",
                          {
                              "p_items": fixture_items,
                              "p_country_code": "EG",
                              "p_currency_code": "EGP",
                          },
                          auth_headers,
                      )

                      shipping = 0
                      if quote_status == 200 and isinstance(quote, dict):
                          if quote.get("requires_configuration"):
                              evidence["failures"].append(
                                  "Shipping configuration is required for the Restore-Test fixture"
                              )
                          else:
                              shipping = float(quote.get("total_shipping", 0) or 0)
                      else:
                          evidence["failures"].append(
                              f"Shipping quote failed for fixture order (http {quote_status})"
                          )

                      if not evidence["failures"]:
                          checkout_reference = (
                              f"paymob-evidence-{os.environ.get('GITHUB_RUN_ID', '0')}-"
                              f"{uuid.uuid4()}"
                          )

                          create_status, created = http_json(
                              "POST",
                              f"{base}/rest/v1/rpc/velora_create_order",
                              {
                                  "p_items": fixture_items,
                                  "p_currency": "EGP",
                                  "p_shipping": shipping,
                                  "p_customer_name": "PAYMOB EVIDENCE",
                                  "p_customer_email": email,
                                  "p_customer_notes": "PAYMOB_SANDBOX_EVIDENCE_FIXTURE",
                                  "p_checkout_reference": checkout_reference,
                              },
                              auth_headers,
                          )

                          if (
                              create_status == 200
                              and isinstance(created, dict)
                              and created.get("ok")
                              and created.get("order_id")
                          ):
                              order = {
                                  "id": created["order_id"],
                                  "order_number": created.get("order_number"),
                                  "total": created.get("total"),
                                  "currency": created.get("currency", "EGP"),
                                  "status": "pending",
                                  "payment_status": "pending",
                              }
                              evidence["checks"]["fixture_order_created"] = True
                          else:
                              evidence["checks"]["fixture_order_created"] = False
                              evidence["failures"].append(
                                  f"Canonical fixture order creation failed (http {create_status})"
                              )
                  else:
                      evidence["checks"]["fixture_order_created"] = False
                      evidence["failures"].append(
                          "No approved product or active variant with stock was found"
                      )

          evidence["checks"]["pending_order_found"] = bool(order)
          if not order:
              evidence["failures"].append(
                  "No pending order owned by the E2E account was found"
              )

          checkout = {}
          checkout_url = None
          if order and access_token:
              status, checkout = http_json(
                  "POST",
                  f"{base}/functions/v1/velora-paymob-checkout",
                  {
                      "order_id": order["id"],
                      "idempotency_key": f"paymob-evidence-{uuid.uuid4()}",
                  },
                  {
                      "apikey": publishable_key,
                      "Authorization": f"Bearer {access_token}",
                  },
              )
              checkout_url = checkout.get("checkout_url")
              evidence["checks"]["checkout_function_http_200"] = status == 200
              evidence["checks"]["paymob_intention_created"] = bool(
                  checkout.get("ok") and checkout.get("intention_id") and checkout_url
              )
              evidence["checkout_response_diagnostic"] = {
                  "http_status": status,
                  "ok": checkout.get("ok"),
                  "status": checkout.get("status"),
                  "code": checkout.get("code"),
                  "error": checkout.get("error"),
                  "provider_error": checkout.get("provider_error"),
              }
              if not checkout_url:
                  evidence["failures"].append(
                      f"Paymob checkout function did not return a checkout URL (http {status})"
                  )

          # Read-only provider inquiry on the freshly-created Paymob attempt.
          # This is a provider contract probe; it does not mutate payment state.
          if order and access_token and checkout.get("ok"):
              try:
                  attempt_query = urllib.parse.urlencode({
                      "order_id": f"eq.{urllib.parse.quote(order['id'])}",
                      "purpose": "eq.marketplace_order",
                      "select": "id,status,metadata,created_at",
                      "order": "created_at.desc",
                      "limit": "1",
                  }, safe=",")
                  attempt_req = urllib.request.Request(
                      f"{base}/rest/v1/payment_attempts?{attempt_query}",
                      method="GET",
                      headers={
                          "apikey": publishable_key,
                          "Authorization": f"Bearer {access_token}",
                      },
                  )
                  with urllib.request.urlopen(attempt_req, timeout=30) as resp:
                      attempt_rows = json.loads(resp.read().decode("utf-8"))
                  latest_attempt_for_inquiry = attempt_rows[0] if attempt_rows else None

                  if not latest_attempt_for_inquiry:
                      evidence["checks"]["inquiry_attempt_found"] = False
                      evidence["failures"].append("Fresh Paymob payment attempt was not found for Inquiry probe")
                  else:
                      inquiry_status, inquiry = http_json(
                          "POST",
                          f"{base}/functions/v1/velora-paymob-inquiry-restore-test",
                          {"payment_attempt_id": latest_attempt_for_inquiry["id"]},
                          {
                              "apikey": publishable_key,
                              "Authorization": f"Bearer {access_token}",
                          },
                      )
                      expected_paymob_order_id = str(
                          (latest_attempt_for_inquiry.get("metadata") or {}).get("paymob_order_id") or ""
                      )
                      provider_order_id = str(inquiry.get("provider_order_id_from_response") or "")
                      evidence["checks"]["inquiry_attempt_found"] = True
                      evidence["checks"]["paymob_inquiry_http_200"] = inquiry_status == 200
                      evidence["checks"]["paymob_inquiry_ok"] = inquiry.get("ok") is True
                      evidence["checks"]["paymob_inquiry_provider_order_match"] = (
                          bool(expected_paymob_order_id)
                          and provider_order_id == expected_paymob_order_id
                      )
                      evidence["provider_inquiry"] = {
                          "http_status": inquiry_status,
                          "ok": inquiry.get("ok"),
                          "code": inquiry.get("code"),
                          "stage": inquiry.get("stage"),
                          "error_class": inquiry.get("error_class"),
                          "paymob_order_id": inquiry.get("paymob_order_id"),
                          "provider_order_id_from_response": inquiry.get("provider_order_id_from_response"),
                          "provider_transaction_id": inquiry.get("provider_transaction_id"),
                          "pending": inquiry.get("pending"),
                          "success": inquiry.get("success"),
                          "is_refunded": inquiry.get("is_refunded"),
                          "is_voided": inquiry.get("is_voided"),
                          "is_auth": inquiry.get("is_auth"),
                          "is_capture": inquiry.get("is_capture"),
                          "is_captured": inquiry.get("is_captured"),
                      }
                      evidence["checks"]["paymob_inquiry_pre_payment_expected_not_found"] = (
                          inquiry_status == 404
                          and inquiry.get("ok") is False
                      )
                      if not (
                          (
                              inquiry_status == 404
                              and inquiry.get("ok") is False
                          )
                          or (
                              evidence["checks"]["paymob_inquiry_http_200"]
                              and evidence["checks"]["paymob_inquiry_ok"]
                              and evidence["checks"]["paymob_inquiry_provider_order_match"]
                          )
                      ):
                          evidence["failures"].append(
                              f"Paymob pre-payment Inquiry unexpected result (http {inquiry_status})"
                          )
              except Exception as exc:
                  evidence["checks"]["inquiry_attempt_found"] = False
                  evidence["checks"]["paymob_inquiry_http_200"] = False
                  evidence["checks"]["paymob_inquiry_correlation"] = False
                  evidence["failures"].append(f"Paymob Inquiry probe failed: {type(exc).__name__}")

          # Complete the sandbox checkout. Test data is documented by Paymob.
          payment_action_started = False
          otp_observed = False
          if checkout_url:
              # Transport isolation probe: compare a plain HTTPS GET with the browser result.
              # This helps distinguish a provider/network 403 from a browser-automation-specific block.
              try:
                  probe_req = urllib.request.Request(
                      checkout_url,
                      method="GET",
                      headers={
                          "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                          "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                      },
                  )
                  try:
                      with urllib.request.urlopen(probe_req, timeout=30) as probe_resp:
                          raw = probe_resp.read().decode("utf-8", errors="replace")
                          evidence["transport_probe"] = {
                              "http_status": probe_resp.status,
                              "body_text": raw[:1000],
                              "response_headers": {
                                  k: probe_resp.headers.get(k)
                                  for k in ["server","cf-ray","cf-cache-status","via","x-cache","content-type","content-length"]
                                  if probe_resp.headers.get(k) is not None
                              },
                          }
                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")
                      evidence["transport_probe"] = {
                          "http_status": exc.code,
                          "body_text": raw[:1000],
                          "response_headers": {
                              k: exc.headers.get(k)
                              for k in ["server","cf-ray","cf-cache-status","via","x-cache","content-type","content-length"]
                              if exc.headers.get(k) is not None
                          },
                      }
              except Exception as exc:
                  evidence["transport_probe"] = {
                      "error": type(exc).__name__,
                  }

              with sync_playwright() as p:
                  # Differential check: Playwright's own HTTP client should behave like the
                  # successful plain HTTPS probe if the provider URL is valid. This is not a
                  # browser navigation and helps isolate Chromium-specific behavior.
                  try:
                      api_context = p.request.new_context(
                          extra_http_headers={
                              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                          }
                      )
                      api_response = api_context.get(checkout_url, timeout=30000)
                      evidence["playwright_request_transport"] = {
                          "http_status": api_response.status,
                          "response_headers": {
                              k: api_response.headers.get(k)
                              for k in ["server","cf-ray","cf-cache-status","via","x-cache","content-type","content-length"]
                              if api_response.headers.get(k) is not None
                          },
                      }
                      api_context.dispose()
                  except Exception as exc:
                      evidence["playwright_request_transport"] = {"error": type(exc).__name__}

                  # Headed Chromium under Xvfb: distinguish headless-only blocking from
                  # normal browser navigation behavior without changing the product path.
                  browser = p.chromium.launch(headless=False)
                  context = browser.new_context(viewport={"width": 1440, "height": 1000})
                  page = context.new_page()
                  browser_telemetry = {"console_errors": [], "page_errors": [], "request_failures": []}
                  page.on("console", lambda msg: browser_telemetry["console_errors"].append(msg.text) if msg.type == "error" else None)
                  page.on("pageerror", lambda exc: browser_telemetry["page_errors"].append(str(exc)))
                  page.on("requestfailed", lambda req: browser_telemetry["request_failures"].append({"url": urllib.parse.urlsplit(req.url).path, "failure": req.failure}))
                  try:
                      response = page.goto(checkout_url, wait_until="domcontentloaded", timeout=60000)
                      page.wait_for_timeout(5000)

                      parsed_checkout = urllib.parse.urlsplit(page.url)
                      redacted_checkout_url = urllib.parse.urlunsplit((parsed_checkout.scheme, parsed_checkout.netloc, parsed_checkout.path, "", ""))
                      evidence["playwright"]["url"] = redacted_checkout_url
                      evidence["playwright"]["http_status"] = response.status if response else None
                      if response:
                          raw_headers = response.headers
                          evidence["playwright"]["response_headers"] = {
                              k: raw_headers.get(k)
                              for k in [
                                  "server", "cf-ray", "cf-cache-status", "via",
                                  "x-cache", "x-cache-hits", "x-request-id",
                                  "content-type", "content-length"
                              ]
                              if raw_headers.get(k) is not None
                          }
                      evidence["playwright"]["title"] = page.title()
                      evidence["playwright"]["frame_urls"] = [
                          urllib.parse.urlunsplit((p.scheme, p.netloc, p.path, "", ""))
                          for p in [urllib.parse.urlsplit(frame.url) for frame in page.frames]
                      ]
                      try:
                          evidence["playwright"]["body_text"] = page.locator("body").inner_text(timeout=10000)[:5000]
                      except Exception:
                          evidence["playwright"]["body_text"] = ""
                      evidence["playwright"]["iframe_count"] = page.locator("iframe").count()
                      evidence["playwright"]["iframe_srcs"] = [
                          (
                              lambda u: urllib.parse.urlunsplit(
                                  (u.scheme, u.netloc, u.path, "", "")
                              )
                          )(urllib.parse.urlsplit(page.locator("iframe").nth(i).get_attribute("src") or ""))
                          for i in range(min(page.locator("iframe").count(), 20))
                      ]

                      def visible_in_page_or_frames(selector):
                          try:
                              loc = page.locator(selector)
                              if loc.count() and loc.first.is_visible():
                                  return loc.first
                          except Exception:
                              pass
                          for frame in page.frames:
                              try:
                                  loc = frame.locator(selector)
                                  if loc.count() and loc.first.is_visible():
                                      return loc.first
                              except Exception:
                                  pass
                          return None

                      def first_visible(selectors):
                          for selector in selectors:
                              loc = visible_in_page_or_frames(selector)
                              if loc:
                                  return loc
                          return None

                      # Unified Checkout may show payment-method selection before card fields.
                      card_method = first_visible([
                          "button:has-text(\"Card\")",
                          "[role=\"button\"]:has-text(\"Card\")",
                          "a:has-text(\"Card\")",
                      ])
                      if not card_method:
                          for frame in page.frames:
                              try:
                                  loc = frame.get_by_text(re.compile(r"^(credit|debit)?\\s*card$", re.I), exact=True)
                                  if loc.count() and loc.first.is_visible():
                                      card_method = loc.first
                                      break
                              except Exception:
                                  pass

                      evidence["playwright"]["card_method_detected"] = bool(card_method)
                      if card_method:
                          try:
                              card_method.click()
                              evidence["playwright"]["card_method_selected"] = True
                              page.wait_for_timeout(3000)
                          except Exception as exc:
                              evidence["playwright"]["card_method_selected"] = False
                              evidence["failures"].append(f"Paymob card method click failed: {type(exc).__name__}")
                      else:
                          evidence["playwright"]["card_method_selected"] = False

                      card_number = first_visible([
                          'input[autocomplete="cc-number"]',
                          'input[name="number"]',
                          'input[name*="card" i][name*="number" i]',
                          'input[placeholder*="card number" i]',
                          'input[placeholder="1234 1234 1234 1234"]',
                      ])
                      expiry = first_visible([
                          'input[autocomplete="cc-exp"]',
                          'input[name*="expiry" i]',
                          'input[placeholder*="expiry" i]',
                      ])
                      cvv = first_visible([
                          'input[autocomplete="cc-csc"]',
                          'input[name*="cvv" i]',
                          'input[name*="cvc" i]',
                          'input[placeholder*="cvv" i]',
                          'input[placeholder*="cvc" i]',
                      ])

                      evidence["playwright"]["checkout_loaded"] = bool(page.url)
                      evidence["playwright"]["card_fields_detected"] = bool(card_number and expiry and cvv)

                      if not (card_number and expiry and cvv):
                          inputs = page.locator("input")
                          meta = []
                          for i in range(min(inputs.count(), 30)):
                              el = inputs.nth(i)
                              try:
                                  if el.is_visible():
                                      meta.append({
                                          "name": el.get_attribute("name"),
                                          "placeholder": el.get_attribute("placeholder"),
                                          "autocomplete": el.get_attribute("autocomplete"),
                                      })
                              except Exception:
                                  pass
                          evidence["playwright"]["visible_inputs"] = meta
                          try:
                              evidence["playwright"]["buttons"] = page.locator("button").all_inner_texts()[:100]
                          except Exception:
                              evidence["playwright"]["buttons"] = []
                          try:
                              evidence["playwright"]["links"] = page.locator("a").all_inner_texts()[:100]
                          except Exception:
                              evidence["playwright"]["links"] = []
                          try:
                              page.screenshot(path="paymob-checkout.png", full_page=True)
                              evidence["playwright"]["screenshot"] = "paymob-checkout.png"
                          except Exception:
                              pass
                          evidence["failures"].append("Paymob card fields could not be identified")
                      else:
                          # Differential sandbox run: Paymob-documented alternate Mastercard.
                          # This is test-only and does not alter the canonical checkout contract.
                          evidence["playwright"]["test_card_variant"] = "mastercard_alt_0008"
                          card_number.fill("5123450000000008")
                          expiry.fill("01/39")
                          cvv.fill("123")

                          name_field = first_visible([
                              'input[autocomplete="cc-name"]',
                              'input[name*="cardholder" i]',
                          ])
                          if name_field:
                              name_field.fill("TEST ACCOUNT")

                          submit = first_visible([
                              'button:has-text("Pay")',
                              'button:has-text("Confirm")',
                              'button:has-text("Continue")',
                              'button[type="submit"]',
                          ])
                          if not submit:
                              evidence["failures"].append("Paymob submit button could not be identified")
                          else:
                              submit.click()
                              payment_action_started = True
                              page.wait_for_timeout(8000)

                          otp = first_visible([
                              'input[name*="otp" i]',
                              'input[placeholder*="otp" i]',
                              'input[name*="verification" i]',
                          ])
                          if otp and otp.is_visible():
                              otp_observed = True
                              otp.fill("123456")
                              confirm = first_visible([
                                  'button:has-text("Verify")',
                                  'button:has-text("Confirm")',
                                  'button[type="submit"]',
                              ])
                              if confirm:
                                  confirm.click()
                              page.wait_for_timeout(8000)

                          page.wait_for_timeout(5000)
                          body = page.locator("body").inner_text(timeout=10000).lower()
                          u = urllib.parse.urlsplit(page.url)
                          evidence["playwright"]["final_url"] = urllib.parse.urlunsplit((u.scheme, u.netloc, u.path, "", ""))
                          evidence["playwright"]["otp_observed"] = otp_observed
                          evidence["playwright"]["post_submit_body_text"] = body[:5000]
                          evidence["playwright"]["completion_text_present"] = any(
                              x in body for x in ("success", "successful", "approved", "thank you", "payment completed")
                          )
                  except PlaywrightTimeoutError:
                      evidence["failures"].append("Paymob checkout page timed out")
                  except Exception as exc:
                      evidence["failures"].append(f"Paymob browser drill failed: {type(exc).__name__}")
                  finally:
                      evidence["playwright"]["browser_telemetry"] = browser_telemetry
                      try:
                          page.screenshot(path="paymob-checkout.png", full_page=True)
                          evidence["playwright"]["screenshot"] = "paymob-checkout.png"
                      except Exception:
                          pass
                      context.close()
                      browser.close()

          evidence["checks"]["sandbox_payment_path_executed"] = payment_action_started

          # Read-only post-payment evidence from Restore-Test.
          if order:
              headers = {"apikey": service_key, "Authorization": f"Bearer {service_key}"}

              attempts = []
              webhooks = []

              # After the customer has submitted the hosted checkout, the order may now
              # have a real Paymob transaction even when the webhook has not reached us.
              # Per Paymob's contract, Order-ID Inquiry is a fallback for an existing
              # transaction; pre-payment 404 is expected and must not be treated as failure.
              post_payment_inquiry = {}
              post_payment_inquiry_done = False

              for _ in range(12):
                  req = urllib.request.Request(
                      f"{base}/rest/v1/payment_attempts?order_id=eq.{urllib.parse.quote(order['id'])}"
                      "&select=id,status,provider_payment_id,payment_reference,provider_session_id,metadata,created_at,completed_at,captured_at"
                      "&order=created_at.desc&limit=5",
                      method="GET",
                      headers=headers,
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          attempts = json.loads(resp.read().decode("utf-8"))
                  except Exception:
                      attempts = []

                  latest_attempt = attempts[0] if attempts else None
                  paymob_order_id = (
                      ((latest_attempt or {}).get("metadata") or {}).get("paymob_order_id")
                      if latest_attempt else None
                  )

                  if payment_action_started and latest_attempt and not post_payment_inquiry_done:
                      try:
                          inquiry_status, inquiry = http_json(
                              "POST",
                              f"{base}/functions/v1/velora-paymob-inquiry-restore-test",
                              {"payment_attempt_id": latest_attempt["id"]},
                              {
                                  "apikey": publishable_key,
                                  "Authorization": f"Bearer {access_token}",
                              },
                          )
                          expected_paymob_order_id = str(paymob_order_id or "")
                          provider_order_id = str(inquiry.get("provider_order_id_from_response") or "")
                          post_payment_inquiry = {
                              "http_status": inquiry_status,
                              "ok": inquiry.get("ok"),
                              "code": inquiry.get("code"),
                              "paymob_order_id": inquiry.get("paymob_order_id"),
                              "provider_order_id_from_response": inquiry.get("provider_order_id_from_response"),
                              "provider_transaction_id": inquiry.get("provider_transaction_id"),
                              "pending": inquiry.get("pending"),
                              "success": inquiry.get("success"),
                              "is_captured": inquiry.get("is_captured"),
                              "provider_order_id_match": bool(expected_paymob_order_id) and provider_order_id == expected_paymob_order_id,
                          }
                          evidence["post_payment_inquiry"] = post_payment_inquiry
                          post_payment_inquiry_done = True
                      except Exception as exc:
                          evidence["post_payment_inquiry"] = {"error": type(exc).__name__}
                          post_payment_inquiry_done = True

                  webhook_query = (
                      f"{base}/rest/v1/provider_webhook_events?provider_code=eq.paymob"
                      "&select=id,event_id,event_type,signature_verified,status,received_at,processed_at,retry_count,failure_reason,payload"
                      "&order=received_at.desc&limit=50"
                  )

                  req = urllib.request.Request(webhook_query, method="GET", headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          all_webhooks = json.loads(resp.read().decode("utf-8"))
                  except Exception:
                      all_webhooks = []

                  webhooks = []
                  for event in all_webhooks if isinstance(all_webhooks, list) else []:
                      payload = event.get("payload") or {}
                      obj = payload.get("obj") if isinstance(payload, dict) else {}
                      provider_order_id = (
                          ((obj or {}).get("order") or {}).get("id")
                          if isinstance(obj, dict) and isinstance(obj.get("order"), dict)
                          else None
                      )
                      if paymob_order_id and str(provider_order_id) == str(paymob_order_id):
                          # Keep raw provider payload out of evidence artifacts/logs.
                          webhooks.append({
                              "id": event.get("id"),
                              "event_id": event.get("event_id"),
                              "event_type": event.get("event_type"),
                              "signature_verified": event.get("signature_verified"),
                              "status": event.get("status"),
                              "received_at": event.get("received_at"),
                              "processed_at": event.get("processed_at"),
                              "retry_count": event.get("retry_count"),
                              "failure_reason": event.get("failure_reason"),
                          })

                  if any(bool(event.get("signature_verified")) and event.get("status") == "processed"
                         for event in webhooks):
                      break
                  time.sleep(5)

              latest_attempt = attempts[0] if attempts else None
              paymob_order_id = (
                  ((latest_attempt or {}).get("metadata") or {}).get("paymob_order_id")
                  if latest_attempt else None
              )
              evidence["db"]["payment_attempt_found"] = bool(latest_attempt)
              evidence["db"]["attempt_status"] = latest_attempt.get("status") if latest_attempt else None
              evidence["db"]["provider_payment_id_present"] = bool(
                  latest_attempt and latest_attempt.get("provider_payment_id")
              )
              evidence["db"]["paymob_order_id_present"] = bool(paymob_order_id)
              evidence["db"]["webhook_event_count_correlated"] = len(webhooks)
              evidence["db"]["signed_webhook_verified"] = any(
                  bool(event.get("signature_verified")) for event in webhooks
              )
              evidence["db"]["processed_webhook_present"] = any(
                  event.get("status") == "processed" and bool(event.get("processed_at"))
                  for event in webhooks
              )
          evidence["passed"] = (
              evidence["checks"].get("authenticated_user", False)
              and evidence["checks"].get("pending_order_found", False)
              and evidence["checks"].get("checkout_function_http_200", False)
              and evidence["checks"].get("paymob_intention_created", False)
              and evidence["checks"].get("sandbox_payment_path_executed", False)
              and evidence["db"].get("payment_attempt_found", False)
              and evidence["db"].get("signed_webhook_verified", False)
              and evidence["db"].get("processed_webhook_present", False)
          )

          Path("paymob-sandbox-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          sys.exit(0 if evidence["passed"] else 1)
          PY

      - name: Upload Paymob sandbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-paymob-sandbox-evidence-${{ github.run_id }}
          path: |
            paymob-sandbox-evidence.json
            paymob-checkout.png
          retention-days: 7
          if-no-files-found: warn
