name: Velora Paymob Sandbox Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - audit/runtime-parity-2026-09-28
    paths:
      - "evidence/paymob-sandbox-evidence.trigger"

permissions:
  contents: read

concurrency:
  group: velora-paymob-sandbox-evidence
  cancel-in-progress: false

jobs:
  paymob-sandbox-evidence:
    name: Paymob sandbox -> Intention -> Checkout -> Webhook evidence
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout current evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium

      - name: Run Paymob sandbox evidence drill
        env:
          SUPABASE_URL: https://arlaxqmhtvjwjbjinjfw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_RDyqYgvJyT37RiQ1PNxYuQ_ov_8eceA
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import uuid
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          base = os.environ["SUPABASE_URL"].rstrip("/")
          publishable_key = os.environ["SUPABASE_PUBLISHABLE_KEY"]
          email = os.environ.get("E2E_EMAIL", "")
          password = os.environ.get("E2E_PASSWORD", "")
          service_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")

          evidence = {
              "schema": "paymob-sandbox-evidence-v1",
              "environment": "restore-test",
              "provider": "paymob",
              "mode": "sandbox",
              "workflow_run_id": int(os.environ.get("GITHUB_RUN_ID", "0") or 0),
              "workflow_sha": os.environ.get("GITHUB_SHA", ""),
              "checks": {},
              "playwright": {},
              "db": {},
              "failures": [],
          }

          def http_json(method, url, body=None, headers=None):
              data = None
              h = dict(headers or {})
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  h.setdefault("Content-Type", "application/json")
              req = urllib.request.Request(url, method=method, data=data, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode("utf-8")
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  try:
                      payload = json.loads(raw) if raw else {}
                  except Exception:
                      payload = {"raw": raw[:500]}
                  return exc.code, payload

          if not email or not password:
              evidence["failures"].append("E2E_EMAIL/E2E_PASSWORD repository secrets are missing")
          if not service_key:
              evidence["failures"].append("SUPABASE_SERVICE_ROLE_KEY repository secret is missing")
          if evidence["failures"]:
              Path("paymob-sandbox-evidence.json").write_text(json.dumps(evidence, ensure_ascii=False, indent=2), encoding="utf-8")
              print(json.dumps(evidence, ensure_ascii=False, indent=2))
              sys.exit(1)

          # Authenticate the owned E2E account.
          status, auth = http_json(
              "POST",
              f"{base}/auth/v1/token?grant_type=password",
              {"email": email, "password": password},
              {"apikey": publishable_key},
          )
          access_token = auth.get("access_token", "")
          user_id = (auth.get("user") or {}).get("id", "")
          evidence["checks"]["auth_http_200"] = status == 200
          evidence["checks"]["authenticated_user"] = bool(access_token and user_id)
          if not access_token or not user_id:
              evidence["failures"].append("Authenticated Supabase session could not be established")
          # Find the latest pending order owned by the authenticated test account.
          # If none exists, create a Restore-Test fixture through the canonical authenticated order RPC.
          order = None
          if access_token and user_id:
              auth_headers = {
                  "apikey": publishable_key,
                  "Authorization": f"Bearer {access_token}",
              }

              query = urllib.parse.urlencode({
                  "customer_id": f"eq.{user_id}",
                  "status": "eq.pending",
                  "payment_status": "eq.pending",
                  "select": "id,order_number,total,currency,status,payment_status,created_at",
                  "order": "created_at.desc",
                  "limit": "1",
              }, safe=",")

              req = urllib.request.Request(
                  f"{base}/rest/v1/orders?{query}",
                  method="GET",
                  headers=auth_headers,
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      rows = json.loads(resp.read().decode("utf-8"))
                  order = rows[0] if rows else None
              except Exception as exc:
                  evidence["failures"].append(
                      f"Pending-order lookup failed: {type(exc).__name__}"
                  )

              if not order:
                  product_query = urllib.parse.urlencode({
                      "status": "eq.approved",
                      "select": "id,name,stock,currency_code,price",
                      "order": "created_at.desc",
                      "limit": "20",
                  }, safe=",")

                  product_req = urllib.request.Request(
                      f"{base}/rest/v1/products?{product_query}",
                      method="GET",
                      headers=auth_headers,
                  )

                  try:
                      with urllib.request.urlopen(product_req, timeout=30) as resp:
                          products = json.loads(resp.read().decode("utf-8"))
                  except Exception as exc:
                      products = []
                      evidence["failures"].append(
                          f"Approved product lookup failed: {type(exc).__name__}"
                      )

                  fixture = None
                  for product in products:
                      variants_query = urllib.parse.urlencode({
                          "product_id": f"eq.{product['id']}",
                          "is_active": "eq.true",
                          "select": "id,name,stock_quantity",
                          "order": "created_at.asc",
                          "limit": "5",
                      }, safe=",")

                      variants_req = urllib.request.Request(
                          f"{base}/rest/v1/product_variants?{variants_query}",
                          method="GET",
                          headers=auth_headers,
                      )

                      try:
                          with urllib.request.urlopen(variants_req, timeout=30) as resp:
                              variants = json.loads(resp.read().decode("utf-8"))
                      except Exception:
                          variants = []

                      available_variants = [
                          v for v in variants
                          if int(v.get("stock_quantity") or 0) > 0
                      ]

                      if available_variants:
                          fixture = {
                              "product_id": product["id"],
                              "product_variant_id": available_variants[0]["id"],
                              "quantity": 1,
                          }
                          break

                      if not variants and int(product.get("stock") or 0) > 0:
                          fixture = {
                              "product_id": product["id"],
                              "quantity": 1,
                          }
                          break

                  if fixture:
                      fixture_items = [fixture]

                      quote_status, quote = http_json(
                          "POST",
                          f"{base}/rest/v1/rpc/velora_quote_cart_shipping",
                          {
                              "p_items": fixture_items,
                              "p_country_code": "EG",
                              "p_currency_code": "EGP",
                          },
                          auth_headers,
                      )

                      shipping = 0
                      if quote_status == 200 and isinstance(quote, dict):
                          if quote.get("requires_configuration"):
                              evidence["failures"].append(
                                  "Shipping configuration is required for the Restore-Test fixture"
                              )
                          else:
                              shipping = float(quote.get("total_shipping", 0) or 0)
                      else:
                          evidence["failures"].append(
                              f"Shipping quote failed for fixture order (http {quote_status})"
                          )

                      if not evidence["failures"]:
                          checkout_reference = (
                              f"paymob-evidence-{os.environ.get('GITHUB_RUN_ID', '0')}-"
                              f"{uuid.uuid4()}"
                          )

                          create_status, created = http_json(
                              "POST",
                              f"{base}/rest/v1/rpc/velora_create_order",
                              {
                                  "p_items": fixture_items,
                                  "p_currency": "EGP",
                                  "p_shipping": shipping,
                                  "p_customer_name": "PAYMOB EVIDENCE",
                                  "p_customer_email": email,
                                  "p_customer_notes": "PAYMOB_SANDBOX_EVIDENCE_FIXTURE",
                                  "p_checkout_reference": checkout_reference,
                              },
                              auth_headers,
                          )

                          if (
                              create_status == 200
                              and isinstance(created, dict)
                              and created.get("ok")
                              and created.get("order_id")
                          ):
                              order = {
                                  "id": created["order_id"],
                                  "order_number": created.get("order_number"),
                                  "total": created.get("total"),
                                  "currency": created.get("currency", "EGP"),
                                  "status": "pending",
                                  "payment_status": "pending",
                              }
                              evidence["checks"]["fixture_order_created"] = True
                          else:
                              evidence["checks"]["fixture_order_created"] = False
                              evidence["failures"].append(
                                  f"Canonical fixture order creation failed (http {create_status})"
                              )
                  else:
                      evidence["checks"]["fixture_order_created"] = False
                      evidence["failures"].append(
                          "No approved product or active variant with stock was found"
                      )

          evidence["checks"]["pending_order_found"] = bool(order)
          if not order:
              evidence["failures"].append(
                  "No pending order owned by the E2E account was found"
              )

          checkout = {}
          checkout_url = None
          if order and access_token:
              status, checkout = http_json(
                  "POST",
                  f"{base}/functions/v1/velora-paymob-checkout",
                  {
                      "order_id": order["id"],
                      "idempotency_key": f"paymob-evidence-{uuid.uuid4()}",
                      "return_url": "https://velora-marketplace-5nv2ooto7-ahmedconccc-7063.vercel.app/",
                  },
                  {
                      "apikey": publishable_key,
                      "Authorization": f"Bearer {access_token}",
                  },
              )
              checkout_url = checkout.get("checkout_url")
              # Use the exact Unified Checkout URL returned by Paymob.
              # Do not rewrite the host in the evidence harness: Paymob's current
              # Egypt documentation uses accept.paymob.com for Unified Checkout.
              evidence["checks"]["checkout_function_http_200"] = status == 200
              evidence["checks"]["paymob_intention_created"] = bool(
                  checkout.get("ok") and checkout.get("intention_id") and checkout_url
              )
              if not checkout_url:
                  evidence["failures"].append(
                      f"Paymob checkout function did not return a checkout URL (http {status})"
                  )

          # Complete the sandbox checkout. Test data is documented by Paymob.
          payment_action_started = False
          otp_observed = False
          if checkout_url:
              with sync_playwright() as p:
                  try:
                      probe_req = urllib.request.Request(
                          checkout_url,
                          method="GET",
                          headers={
                              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                          },
                      )
                      try:
                          with urllib.request.urlopen(probe_req, timeout=30) as probe_resp:
                              evidence["transport_probe"] = {
                                  "http_status": probe_resp.status,
                                  "response_headers": {
                                      k: probe_resp.headers.get(k)
                                      for k in ["server","cf-ray","cf-cache-status","content-type","content-length"]
                                      if probe_resp.headers.get(k) is not None
                                  },
                              }
                      except urllib.error.HTTPError as exc:
                          evidence["transport_probe"] = {
                              "http_status": exc.code,
                              "response_headers": {
                                  k: exc.headers.get(k)
                                  for k in ["server","cf-ray","cf-cache-status","content-type","content-length"]
                                  if exc.headers.get(k) is not None
                              },
                          }
                  except Exception as exc:
                      evidence["transport_probe"] = {"error": type(exc).__name__}

              with sync_playwright() as p:
                  # Reuse the historically successful headed Chromium mode from
                  # the prior Paymob evidence run. This specifically tests whether the
                  # 403 is headless-only without changing the product/provider path.
                  browser = p.chromium.launch(headless=False)
                  context = browser.new_context(viewport={"width": 1440, "height": 1000})
                  evidence["playwright"]["browser_mode"] = "headed"
                  page = context.new_page()
                  console_errors = []
                  page_errors = []
                  request_failures = []
                  page.on("console", lambda msg: console_errors.append({
                      "type": msg.type,
                      "text": msg.text[:300],
                  }) if msg.type == "error" else None)
                  page.on("pageerror", lambda exc: page_errors.append(str(exc)[:300]))
                  page.on("requestfailed", lambda request: request_failures.append({
                      "url": safe_frame_url(request.url) if "safe_frame_url" in locals() else urllib.parse.urlunsplit((urllib.parse.urlsplit(request.url).scheme, urllib.parse.urlsplit(request.url).netloc, urllib.parse.urlsplit(request.url).path, "[redacted]" if urllib.parse.urlsplit(request.url).query else "", "")),
                      "failure": request.failure,
                  }))
                  try:
                      page.goto(checkout_url, wait_until="domcontentloaded", timeout=60000)
                      try:
                          page.wait_for_load_state("networkidle", timeout=30000)
                      except PlaywrightTimeoutError:
                          pass
                      # Unified Checkout is a Paymob-hosted dynamic UI. Give the
                      # payment application enough time to mount its method selector
                      # and secure card fields before declaring the browser path broken.
                      page.wait_for_timeout(12000)

                      def safe_frame_url(raw):
                          parsed = urllib.parse.urlsplit(raw)
                          return urllib.parse.urlunsplit(
                              (parsed.scheme, parsed.netloc, parsed.path, "[redacted]" if parsed.query else "", "")
                          )

                      evidence["playwright"]["frame_urls"] = [
                          safe_frame_url(frame.url) for frame in page.frames if frame.url
                      ]
                      evidence["playwright"]["iframe_count"] = page.locator("iframe").count()

                      def visible_in_page_or_frames(selector):
                          try:
                              loc = page.locator(selector)
                              if loc.count() and loc.first.is_visible():
                                  return loc.first
                          except Exception:
                              pass
                          for frame in page.frames:
                              try:
                                  loc = frame.locator(selector)
                                  if loc.count() and loc.first.is_visible():
                                      return loc.first
                              except Exception:
                                  pass
                          return None

                      def first_visible(selectors):
                          for selector in selectors:
                              loc = visible_in_page_or_frames(selector)
                              if loc:
                                  return loc
                          return None

                      # Paymob's current Unified Checkout inspection exposes direct
                      # card fields; prefer those exact IDs, then fall back to generic
                      # selectors in case the hosted UI changes.
                      card_method = first_visible([
                          'button:has-text("Card")',
                          'button:has-text("card")',
                          '[role="button"]:has-text("Card")',
                          '[role="button"]:has-text("card")',
                      ])
                      evidence["playwright"]["card_method_visible"] = bool(card_method)

                      card_number = first_visible([
                          '#number',
                          'input[autocomplete="cc-number"]',
                          'input[name*="card" i][name*="number" i]',
                          'input[placeholder*="card number" i]',
                          'input[inputmode="numeric"][maxlength="16"]',
                      ])
                      expiry = first_visible([
                          '#expiry',
                          'input[autocomplete="cc-exp"]',
                          'input[name*="expiry" i]',
                          'input[placeholder*="expiry" i]',
                      ])
                      cvv = first_visible([
                          '#cvc',
                          'input[autocomplete="cc-csc"]',
                          'input[name*="cvv" i]',
                          'input[name*="cvc" i]',
                          'input[placeholder*="cvv" i]',
                          'input[placeholder*="cvc" i]',
                      ])
                      evidence["playwright"]["checkout_title"] = page.title()
                      evidence["playwright"]["document_ready_state"] = page.evaluate("document.readyState")
                      try:
                          body_text = page.locator("body").inner_text(timeout=10000)
                          evidence["playwright"]["body_text_prefix"] = body_text[:1200]
                      except Exception:
                          evidence["playwright"]["body_text_prefix"] = ""
                      try:
                          evidence["playwright"]["html_length"] = len(page.content())
                      except Exception:
                          evidence["playwright"]["html_length"] = None
                      evidence["playwright"]["console_errors"] = console_errors[-20:]
                      evidence["playwright"]["page_errors"] = page_errors[-20:]
                      evidence["playwright"]["request_failures"] = request_failures[-20:]

                      if not (card_number and expiry and cvv) and card_method:
                          try:
                              card_method.click()
                              page.wait_for_timeout(3000)
                              evidence["playwright"]["card_method_selected"] = True
                              card_number = first_visible(['#number','input[autocomplete="cc-number"]','input[name*="card" i][name*="number" i]','input[placeholder*="card number" i]','input[inputmode="numeric"][maxlength="16"]'])
                              expiry = first_visible(['#expiry','input[autocomplete="cc-exp"]','input[name*="expiry" i]','input[placeholder*="expiry" i]'])
                              cvv = first_visible(['#cvc','input[autocomplete="cc-csc"]','input[name*="cvv" i]','input[name*="cvc" i]','input[placeholder*="cvv" i]','input[placeholder*="cvc" i]'])
                          except Exception:
                              evidence["playwright"]["card_method_selected"] = False
                      else:
                          evidence["playwright"]["card_method_selected"] = False

                      evidence["playwright"]["checkout_loaded"] = bool(page.url)
                      evidence["playwright"]["card_fields_detected"] = bool(card_number and expiry and cvv)

                      if not (card_number and expiry and cvv):
                          buttons = page.locator("button")
                          button_meta = []
                          for i in range(min(buttons.count(), 40)):
                              el = buttons.nth(i)
                              try:
                                  if el.is_visible():
                                      button_meta.append({
                                          "text": (el.inner_text() or "").strip()[:120],
                                          "type": el.get_attribute("type"),
                                      })
                              except Exception:
                                  pass
                          evidence["playwright"]["visible_buttons"] = button_meta

                          inputs = page.locator("input")
                          meta = []
                          for i in range(min(inputs.count(), 30)):
                              el = inputs.nth(i)
                              try:
                                  if el.is_visible():
                                      meta.append({
                                          "name": el.get_attribute("name"),
                                          "placeholder": el.get_attribute("placeholder"),
                                          "autocomplete": el.get_attribute("autocomplete"),
                                      })
                              except Exception:
                                  pass
                          evidence["playwright"]["visible_inputs"] = meta
                          screenshot_path = "paymob-checkout-debug.png"
                          try:
                              page.screenshot(path=screenshot_path, full_page=True)
                              evidence["playwright"]["debug_screenshot"] = screenshot_path
                          except Exception:
                              pass
                          evidence["failures"].append("Paymob card fields could not be identified")
                      else:
                          card_number.fill("5123456789012346")
                          expiry.fill("01/39")
                          cvv.fill("123")

                          name_field = first_visible([
                              'input[autocomplete="cc-name"]',
                              'input[name*="cardholder" i]',
                          ])
                          if name_field:
                              name_field.fill("TEST ACCOUNT")

                          submit = first_visible([
                              '#pay-button',
                              'button:has-text("Pay")',
                              'button:has-text("Confirm")',
                              'button:has-text("Continue")',
                              'button[type="submit"]',
                          ])
                          if not submit:
                              evidence["failures"].append("Paymob submit button could not be identified")
                          else:
                              submit.click()
                              payment_action_started = True
                              evidence["playwright"]["payment_clicked"] = True

                              # Keep the actual Paymob / Mastercard 3DS browser session alive.
                              # Do not inject or fabricate OTP. While the browser remains open,
                              # poll read-only provider evidence so we can distinguish a
                              # browser-lifetime issue from a provider-side pending state.
                              payment_attempt_id = checkout.get("payment_attempt_id")

                              if not payment_attempt_id and service_key:
                                  lookup_query = urllib.parse.urlencode({
                                      "order_id": f"eq.{order['id']}",
                                      "select": "id,status,provider_payment_id,created_at",
                                      "order": "created_at.desc",
                                      "limit": "1",
                                  }, safe=",")
                                  lookup_req = urllib.request.Request(
                                      f"{base}/rest/v1/payment_attempts?{lookup_query}",
                                      method="GET",
                                      headers={
                                          "apikey": service_key,
                                          "Authorization": f"Bearer {service_key}",
                                      },
                                  )
                                  try:
                                      with urllib.request.urlopen(lookup_req, timeout=30) as resp:
                                          lookup_rows = json.loads(resp.read().decode("utf-8"))
                                      payment_attempt_id = lookup_rows[0]["id"] if lookup_rows else None
                                  except Exception:
                                      payment_attempt_id = None

                              evidence["playwright"]["payment_attempt_id_available"] = bool(payment_attempt_id)

                              def read_attempt_state():
                                  if not service_key or not order:
                                      return None
                                  q = urllib.parse.urlencode({
                                      "order_id": f"eq.{order['id']}",
                                      "select": "id,status,provider_payment_id,metadata,created_at,completed_at,captured_at",
                                      "order": "created_at.desc",
                                      "limit": "1",
                                  }, safe=",")
                                  req = urllib.request.Request(
                                      f"{base}/rest/v1/payment_attempts?{q}",
                                      method="GET",
                                      headers={
                                          "apikey": service_key,
                                          "Authorization": f"Bearer {service_key}",
                                      },
                                  )
                                  try:
                                      with urllib.request.urlopen(req, timeout=20) as resp:
                                          rows = json.loads(resp.read().decode("utf-8"))
                                      return rows[0] if rows else None
                                  except Exception:
                                      return None

                              def read_webhook_evidence():
                                  if not service_key:
                                      return []
                                  q = urllib.parse.urlencode({
                                      "provider_code": "eq.paymob",
                                      "select": "id,event_id,event_type,signature_verified,status,received_at,processed_at,retry_count,payload",
                                      "order": "received_at.desc",
                                      "limit": "20",
                                  }, safe=",")
                                  req = urllib.request.Request(
                                      f"{base}/rest/v1/provider_webhook_events?{q}",
                                      method="GET",
                                      headers={
                                          "apikey": service_key,
                                          "Authorization": f"Bearer {service_key}",
                                      },
                                  )
                                  try:
                                      with urllib.request.urlopen(req, timeout=20) as resp:
                                          rows = json.loads(resp.read().decode("utf-8"))
                                  except Exception:
                                      return []
                                  target = None
                                  try:
                                      target = str(
                                          (attempt_state or {}).get("metadata", {}).get("paymob_order_id") or ""
                                      ).strip()
                                  except Exception:
                                      target = ""
                                  if not target:
                                      return rows
                                  matched = []
                                  for event in rows:
                                      payload = event.get("payload") or {}
                                      obj = payload.get("obj") if isinstance(payload, dict) else {}
                                      order_obj = obj.get("order") if isinstance(obj, dict) else {}
                                      provider_order_id = str(
                                          order_obj.get("id") if isinstance(order_obj, dict) else ""
                                      ).strip()
                                      if provider_order_id == target:
                                          matched.append(event)
                                  return matched

                              attempt_state = read_attempt_state()
                              if not payment_attempt_id and attempt_state:
                                  payment_attempt_id = attempt_state.get("id")

                              terminal_observed = False
                              webhook_observed = False
                              loop_started = time.time()
                              while time.time() - loop_started < 240:
                                  attempt_state = read_attempt_state()

                                  inquiry_snapshot = None
                                  if payment_attempt_id and access_token:
                                      inquiry_status, inquiry_snapshot = http_json(
                                          "POST",
                                          f"{base}/functions/v1/velora-paymob-inquiry-restore-test",
                                          {"payment_attempt_id": payment_attempt_id},
                                          {
                                              "apikey": publishable_key,
                                              "Authorization": f"Bearer {access_token}",
                                          },
                                      )
                                      evidence["playwright"]["last_inquiry_http_status"] = inquiry_status
                                      evidence["playwright"]["last_inquiry"] = {
                                          "ok": inquiry_snapshot.get("ok") if isinstance(inquiry_snapshot, dict) else None,
                                          "paymob_order_id": inquiry_snapshot.get("paymob_order_id") if isinstance(inquiry_snapshot, dict) else None,
                                          "provider_transaction_id": inquiry_snapshot.get("provider_transaction_id") if isinstance(inquiry_snapshot, dict) else None,
                                          "pending": inquiry_snapshot.get("pending") if isinstance(inquiry_snapshot, dict) else None,
                                          "success": inquiry_snapshot.get("success") if isinstance(inquiry_snapshot, dict) else None,
                                          "is_captured": inquiry_snapshot.get("is_captured") if isinstance(inquiry_snapshot, dict) else None,
                                          "data_migs_status": inquiry_snapshot.get("data_migs_status") if isinstance(inquiry_snapshot, dict) else None,
                                          "data_migs_result": inquiry_snapshot.get("data_migs_result") if isinstance(inquiry_snapshot, dict) else None,
                                          "data_txn_response_code": inquiry_snapshot.get("data_txn_response_code") if isinstance(inquiry_snapshot, dict) else None,
                                      }
                                      if (
                                          isinstance(inquiry_snapshot, dict)
                                          and inquiry_snapshot.get("ok")
                                          and inquiry_snapshot.get("success") is True
                                          and inquiry_snapshot.get("is_captured") is True
                                      ):
                                          terminal_observed = True

                                  webhook_matches = read_webhook_evidence()
                                  signed_processed = any(
                                      bool(event.get("signature_verified"))
                                      and event.get("status") == "processed"
                                      and bool(event.get("processed_at"))
                                      for event in webhook_matches
                                  )
                                  webhook_observed = signed_processed

                                  evidence["playwright"]["webhook_match_count_while_browser_open"] = len(webhook_matches)
                                  evidence["playwright"]["signed_processed_webhook_while_browser_open"] = signed_processed

                                  otp = first_visible([
                                      'input[name*="otp" i]',
                                      'input[placeholder*="otp" i]',
                                      'input[name*="verification" i]',
                                  ])
                                  if otp and otp.is_visible():
                                      otp_observed = True
                                      evidence["playwright"]["otp_observed"] = True

                                  if terminal_observed or webhook_observed:
                                      break
                                  page.wait_for_timeout(10000)

                              evidence["playwright"]["browser_session_observed_seconds"] = round(
                                  time.time() - loop_started, 1
                              )
                              evidence["playwright"]["terminal_observed_while_browser_open"] = terminal_observed
                              evidence["playwright"]["webhook_terminal_observed_while_browser_open"] = webhook_observed

                          body = page.locator("body").inner_text(timeout=10000).lower()
                          evidence["playwright"]["otp_observed"] = otp_observed
                          evidence["playwright"]["completion_text_present"] = any(
                              x in body for x in ("success", "successful", "approved", "thank you", "payment completed")
                          )
                  except PlaywrightTimeoutError:
                      evidence["failures"].append("Paymob checkout page timed out")
                  except Exception as exc:
                      evidence["failures"].append(f"Paymob browser drill failed: {type(exc).__name__}")
                  finally:
                      context.close()
                      browser.close()

          evidence["checks"]["sandbox_payment_path_executed"] = payment_action_started

          # Read-only post-payment evidence from Restore-Test.
          if order:
              headers = {"apikey": service_key, "Authorization": f"Bearer {service_key}"}

              attempts = []
              webhooks = []

              for _ in range(12):
                  req = urllib.request.Request(
                      f"{base}/rest/v1/payment_attempts?order_id=eq.{urllib.parse.quote(order['id'])}"
                      "&select=id,status,provider_payment_id,payment_reference,provider_session_id,created_at,completed_at,captured_at"
                      "&order=created_at.desc&limit=5",
                      method="GET",
                      headers=headers,
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          attempts = json.loads(resp.read().decode("utf-8"))
                  except Exception:
                      attempts = []

                  latest_attempt = attempts[0] if attempts else None
                  provider_payment_id = latest_attempt.get("provider_payment_id") if latest_attempt else None

                  webhook_query = (
                      f"{base}/rest/v1/provider_webhook_events?provider_code=eq.paymob"
                      "&select=id,event_id,event_type,signature_verified,status,received_at,processed_at,retry_count,failure_reason,payload"
                      "&order=received_at.desc&limit=50"
                  )
                  req = urllib.request.Request(webhook_query, method="GET", headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          all_webhooks = json.loads(resp.read().decode("utf-8"))
                  except Exception:
                      all_webhooks = []

                  target_paymob_order_id = ""
                  attempt_state_for_webhook = None
                  if latest_attempt:
                      attempt_meta_query = (
                          f"{base}/rest/v1/payment_attempts"
                          f"?id=eq.{urllib.parse.quote(str(latest_attempt.get('id')))}"
                          "&select=id,metadata&limit=1"
                      )
                      meta_req = urllib.request.Request(attempt_meta_query, method="GET", headers=headers)
                      try:
                          with urllib.request.urlopen(meta_req, timeout=30) as resp:
                              meta_rows = json.loads(resp.read().decode("utf-8"))
                          attempt_state_for_webhook = meta_rows[0] if meta_rows else None
                          target_paymob_order_id = str(
                              (attempt_state_for_webhook or {}).get("metadata", {}).get("paymob_order_id") or ""
                          ).strip()
                      except Exception:
                          target_paymob_order_id = ""

                  webhooks = []
                  for event in all_webhooks:
                      payload = event.get("payload") or {}
                      obj = payload.get("obj") if isinstance(payload, dict) else {}
                      order_obj = obj.get("order") if isinstance(obj, dict) else {}
                      provider_order_id = str(
                          order_obj.get("id") if isinstance(order_obj, dict) else ""
                      ).strip()
                      if target_paymob_order_id and provider_order_id == target_paymob_order_id:
                          webhooks.append({
                              "id": event.get("id"),
                              "event_id": event.get("event_id"),
                              "event_type": event.get("event_type"),
                              "signature_verified": event.get("signature_verified"),
                              "status": event.get("status"),
                              "received_at": event.get("received_at"),
                              "processed_at": event.get("processed_at"),
                              "retry_count": event.get("retry_count"),
                              "failure_reason": event.get("failure_reason"),
                          })

                  if any(bool(event.get("signature_verified")) and event.get("status") == "processed"
                         for event in webhooks):
                      break
                  time.sleep(5)

              latest_attempt = attempts[0] if attempts else None
              evidence["db"]["payment_attempt_found"] = bool(latest_attempt)
              evidence["db"]["attempt_status"] = latest_attempt.get("status") if latest_attempt else None
              evidence["db"]["provider_payment_id_present"] = bool(
                  latest_attempt and latest_attempt.get("provider_payment_id")
              )

              order_rows = []
              order_query = (
                  f"{base}/rest/v1/orders?id=eq.{urllib.parse.quote(order['id'])}"
                  "&select=id,status,payment_status,updated_at&limit=1"
              )
              req = urllib.request.Request(order_query, method="GET", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      order_rows = json.loads(resp.read().decode("utf-8"))
              except Exception:
                  order_rows = []
              current_order = order_rows[0] if order_rows else None
              evidence["db"]["order_status"] = current_order.get("status") if current_order else None
              evidence["db"]["order_payment_status"] = current_order.get("payment_status") if current_order else None
              evidence["db"]["webhook_event_count_recent"] = len(webhooks)
              evidence["db"]["signed_webhook_verified"] = any(
                  bool(event.get("signature_verified")) for event in webhooks
              )
              evidence["db"]["processed_webhook_present"] = any(
                  event.get("status") == "processed" and bool(event.get("processed_at"))
                  for event in webhooks
              )

          evidence["passed"] = (
              evidence["checks"].get("authenticated_user", False)
              and evidence["checks"].get("pending_order_found", False)
              and evidence["checks"].get("checkout_function_http_200", False)
              and evidence["checks"].get("paymob_intention_created", False)
              and evidence["checks"].get("sandbox_payment_path_executed", False)
              and evidence["db"].get("payment_attempt_found", False)
              and evidence["db"].get("attempt_status") == "captured"
              and evidence["db"].get("signed_webhook_verified", False)
              and evidence["db"].get("processed_webhook_present", False)
              and evidence["db"].get("order_payment_status") == "paid"
              and evidence["db"].get("order_status") == "confirmed"
          )

          Path("paymob-sandbox-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          sys.exit(0 if evidence["passed"] else 1)
          PY

      - name: Upload Paymob sandbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-paymob-sandbox-evidence-${{ github.run_id }}
          path: paymob-sandbox-evidence.json
          retention-days: 7
          if-no-files-found: error
