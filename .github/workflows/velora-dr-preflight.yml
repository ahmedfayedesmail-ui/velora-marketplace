name: Velora DR Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - audit/runtime-parity-2026-09-28
    paths:
      - ".github/workflows/velora-dr-preflight.yml"
      - "docs/FREE_ZERO_COST_TOOLING.md"

permissions:
  contents: read

jobs:
  dr-preflight:
    name: DR tooling and secret readiness (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/runtime-parity-2026-09-28
          fetch-depth: 1

      - name: Check local backup tooling
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          command -v pg_dump >/dev/null && echo "pg_dump=available" || echo "pg_dump=missing"
          command -v openssl >/dev/null && echo "openssl=available" || echo "openssl=missing"
          command -v sha256sum >/dev/null && echo "sha256sum=available" || echo "sha256sum=missing"

      - name: Check required DR secrets without revealing them
        id: secrets
        shell: bash
        env:
          PROD_DATABASE_URL: ${{ secrets.VELORA_PRODUCTION_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.VELORA_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          db="missing"
          enc="missing"
          [[ -n "${PROD_DATABASE_URL:-}" ]] && db="present"
          [[ -n "${BACKUP_ENCRYPTION_KEY:-}" ]] && enc="present"
          {
            echo "production_database_url=${db}"
            echo "backup_encryption_key=${enc}"
          } | tee dr-secret-readiness.txt

      - name: Produce DR preflight report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Velora DR Preflight"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| pg_dump | $(command -v pg_dump >/dev/null && echo available || echo missing) |"
            echo "| openssl | $(command -v openssl >/dev/null && echo available || echo missing) |"
            echo "| sha256sum | $(command -v sha256sum >/dev/null && echo available || echo missing) |"
            cat dr-secret-readiness.txt | sed 's/^/| /; s/=/ | /; s/$/ |/'
            echo
            echo "No Production connection was opened. This workflow is preflight-only."
          } > dr-preflight-report.md
          cat dr-preflight-report.md

      - name: Upload preflight report
        uses: actions/upload-artifact@v4
        with:
          name: velora-dr-preflight
          path: |
            dr-preflight-report.md
            dr-secret-readiness.txt
          retention-days: 7
