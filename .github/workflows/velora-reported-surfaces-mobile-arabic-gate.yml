name: Velora Reported Surface Mobile + Arabic Gate

on:
  push:
    branches:
      - audit/runtime-parity-2026-09-28
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reported-surfaces:
    name: Reported admin surfaces on mobile + Arabic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://arlaxqmhtvjwjbjinjfw.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: audit/runtime-parity-2026-09-28
          fetch-depth: 1

      - name: Start exact-source server
        run: |
          nohup python3 -m http.server 4173 -d src > reported-surface-local.log 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4173/", timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("LOCAL_EXACT_SOURCE_SERVER_NOT_READY")
          PY

      - name: Setup Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium

      - name: Run reported surface evidence
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request, sys
          from playwright.sync_api import sync_playwright

          BASE=os.environ['SUPABASE_URL'].rstrip('/')
          KEY=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          APP=os.environ['APP_URL'].rstrip('/')
          out={'schema':'velora-reported-mobile-arabic.v1','execution_target':'local_exact_source','app_url':APP,'checks':{},'failures':[],'browser_errors':[]}

          def api(path, method='GET', payload=None):
              data=json.dumps(payload).encode() if payload is not None else None
              headers={'apikey':KEY,'Authorization':'Bearer '+KEY,'Accept':'application/json'}
              if payload is not None: headers['Content-Type']='application/json'
              req=urllib.request.Request(BASE+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read().decode() or 'null')

          users=api('/auth/v1/admin/users?page=1&per_page=1000').get('users',[])
          auth={str(u.get('id')):u for u in users if u.get('id')}
          rows=api('/rest/v1/user_roles?select=user_id&role=eq.owner')
          owner_uid=next((str(x['user_id']) for x in rows if str(x.get('user_id')) in auth),None)
          if not owner_uid: raise RuntimeError('owner fixture missing')
          owner_email=str(auth[owner_uid].get('email') or '')
          link=api('/auth/v1/admin/generate_link','POST',{'type':'magiclink','email':owner_email,'options':{'redirect_to':APP+'/#home'}})
          token=str(link.get('hashed_token') or '')
          if not token: raise RuntimeError('owner magiclink unavailable')

          def session(p):
              return p.evaluate('''async()=>{const r=await window.mahaSupabase.auth.getSession();return !!r?.data?.session?.user}''')
          def observe(p):
              p.on('pageerror',lambda e:out['browser_errors'].append('pageerror:'+str(e)))
              p.on('console',lambda m:out['browser_errors'].append('console:'+m.text) if m.type=='error' else None)
          def overflow(p,label):
              x=p.evaluate('''()=>({w:innerWidth,doc:document.documentElement.scrollWidth,body:document.body.scrollWidth})''')
              out['checks'][label+'_overflow']=max(x['doc'],x['body']) <= x['w']+4
              if not out['checks'][label+'_overflow']: out['failures'].append(label+': horizontal document overflow')

          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True)
              p=b.new_page(viewport={'width':390,'height':844},locale='en-US')
              observe(p)
              p.goto(APP+'/#home',wait_until='domcontentloaded',timeout=60000)
              ok=p.evaluate('''async t=>{const r=await window.mahaSupabase.auth.verifyOtp({token_hash:t,type:'magiclink'});return !!r?.data?.session?.user}''',token)
              if not ok: raise RuntimeError('owner authentication failed')
              p.wait_for_timeout(1000)
              out['checks']['owner_authenticated']=bool(session(p))
              p.evaluate("()=>window.switchPlatform('admin')")
              p.wait_for_selector('#adminContent .admin-section-card h3',state='visible',timeout=30000)

              p.evaluate("()=>window.VELORA_CANONICAL_ADMIN_SECTION('gift_cards')")
              p.wait_for_timeout(1200)
              gift=p.locator('#adminContent')
              gift_html=p.evaluate("()=>document.getElementById('adminContent')?.innerHTML||''")
              gift_text=gift.inner_text()
              out['checks']['gift_surface_loaded']=gift.count()==1 and ('Gift Cards' in gift_text or 'بطاقات الهدايا' in gift_text)
              out['checks']['gift_dom_debug_before_ar']=(gift_html[:1200])
              code=p.locator('#veloraAdminGiftCards41Form input[name="code"]')
              out['checks']['gift_code_minlength']=(code.get_attribute('minlength')=='8') if code.count() else False
              out['checks']['gift_code_maxlength']=(code.get_attribute('maxlength')=='80') if code.count() else False
              if code.count():
                  code.fill('SME20')
                  out['checks']['gift_short_code_blocked']=bool(p.evaluate('''()=>!document.querySelector('#veloraAdminGiftCards41Form input[name="code"]').checkValidity()'''))
              else:
                  out['checks']['gift_short_code_blocked']=False
              overflow(p,'gift')

              p.evaluate("()=>window.VELORA_CANONICAL_ADMIN_SECTION('subscriptionControl')")
              p.wait_for_timeout(800)
              sub=p.locator('#adminContent')
              out['checks']['subscription_surface_loaded']=sub.count()==1 and 'Subscription Control' in sub.inner_text()
              overflow(p,'subscription')

              p.evaluate("()=>window.VELORA_V5_SET_LANGUAGE('ar')")
              p.wait_for_timeout(1000)
              out['checks']['rtl']=p.evaluate("()=>document.documentElement.dir==='rtl'")
              out['checks']['lang_ar']=p.evaluate("()=>document.documentElement.lang==='ar'")
              p.evaluate("()=>window.VELORA_CANONICAL_ADMIN_SECTION('gift_cards')")
              p.wait_for_timeout(1200)
              out['checks']['gift_arabic_title']='بطاقات الهدايا' in p.locator('#adminContent').inner_text()
              out['checks']['gift_debug_locale']=p.evaluate("()=>({htmlLang:document.documentElement.lang,dir:document.documentElement.dir,globalLocale:window.VELORA_GLOBAL_LOCALE,globalStateLocale:window.VELORA_GLOBAL_LOCALE_STATE?.locale,hasPack:!!window.__VELORA_PACK?.ar,packValue:String(window.__VELORA_PACK?.ar?.['Gift Cards']||''),translation:typeof window.VELORA_GET_TRANSLATION==='function' ? String(window.VELORA_GET_TRANSLATION('Gift Cards','ar')||'') : 'NO_GET_TRANSLATION'})")
              out['checks']['i18n_render_available']=bool(p.evaluate("()=>typeof window.VELORA_I18N_RENDER==='function'"))
              out['checks']['gift_translation_pack']=p.evaluate("()=>String(window.__VELORA_PACK?.ar?.['Gift Cards']||'')==='بطاقات الهدايا'")
              out['checks']['gift_h3_html']=p.locator('#adminContent h3').first.get_attribute('data-velora-i18n')=='Gift Cards'
              p.evaluate("()=>{try{window.VELORA_I18N_RENDER?.(document.getElementById('adminContent'));window.VELORA_TRANSLATE_ALL?.();}catch(e){}}")
              p.wait_for_timeout(200)
              out['checks']['gift_arabic_title_after_forced_render']='بطاقات الهدايا' in p.locator('#adminContent').inner_text()
              out['checks']['gift_dom_debug']=p.locator('#adminContent h3').first.inner_text()
              p.evaluate("()=>window.VELORA_CANONICAL_ADMIN_SECTION('subscriptionControl')")
              p.wait_for_timeout(800)
              out['checks']['subscription_arabic_title']='التحكم في الاشتراكات' in p.locator('#adminContent').inner_text()
              overflow(p,'arabic')
              p.screenshot(path='reported-admin-mobile-ar.png',full_page=True)
              p.close(); b.close()

          out['browser_errors']=list(dict.fromkeys(out['browser_errors']))[:50]
          out['passed']=not out['failures'] and not out['browser_errors'] and all(v is True for v in out['checks'].values())
          with open('velora-reported-mobile-arabic-evidence.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          sys.exit(0 if out['passed'] else 1)
          PY

      - name: Upload reported surface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-reported-mobile-arabic-evidence
          path: |
            velora-reported-mobile-arabic-evidence.json
            reported-admin-mobile-ar.png
            reported-surface-local.log
          retention-days: 7