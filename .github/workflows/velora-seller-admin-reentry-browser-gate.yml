# Re-run marker: validate current authenticated open/close/re-entry lifecycle (runtime-parity-2026-09-30, focused-reentry-v7).
name: Velora Seller Admin Reentry Browser Gate

on:
  push:
    branches:
      - audit/runtime-parity-2026-09-28
    paths:
      - "src/scripts/12-localization.js"
      - "src/scripts/56-s2d-admin.js"
      - "src/scripts/63-platform-router.js"
      - "tests/platform-reentry-contract.test.mjs"
      - ".github/workflows/velora-seller-admin-reentry-browser-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  reentry-browser:
    name: Authenticated Seller/Admin open -> close -> re-entry -> history
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout tested branch
        uses: actions/checkout@v4
        with:
          ref: audit/runtime-parity-2026-09-28
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium

      - name: Start exact-source local server
        run: |
          nohup python3 -m http.server 4173 -d src > reentry-local-server.log 2>&1 &
          python3 - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:4173/", timeout=2) as response:
                      if response.status == 200:
                          print("exact-source local server ready")
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("LOCAL_EXACT_SOURCE_SERVER_NOT_READY")
          PY

      - name: Run role-authenticated reentry browser evidence
        id: reentry
        env:
          PREVIEW_URL: http://127.0.0.1:4173
          SUPABASE_URL: https://arlaxqmhtvjwjbjinjfw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          from playwright.sync_api import sync_playwright

          browser_errors = []

          BASE = os.environ["SUPABASE_URL"].rstrip("/")
          PREVIEW = os.environ["PREVIEW_URL"].rstrip("/")
          SERVICE_ROLE = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")

          evidence = {
              "schema": "seller-admin-reentry-browser.v7",
              "preview_url": PREVIEW,
              "execution_target": "local_exact_source",
              "workflow_sha": os.environ.get("GITHUB_SHA", ""),
              "checks": {},
              "roles": {},
              "failures": [],
          }

          if not SERVICE_ROLE:
              evidence["failures"].append("SUPABASE_SERVICE_ROLE_KEY is missing")
              with open("seller-admin-reentry-browser-evidence.json", "w", encoding="utf-8") as f:
                  json.dump(evidence, f, ensure_ascii=False, indent=2)
              print(json.dumps(evidence, ensure_ascii=False, indent=2))
              sys.exit(1)

          def api(path, method="GET", payload=None):
              data = None
              headers = {
                  "apikey": SERVICE_ROLE,
                  "Authorization": "Bearer " + SERVICE_ROLE,
                  "Content-Type": "application/json",
              }
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode("utf-8")
                  return json.loads(body) if body else None

          def auth_users():
              users = api("/auth/v1/admin/users?page=1&per_page=1000")
              if isinstance(users, dict):
                  users = users.get("users", [])
              return users or []

          AUTH_USERS = auth_users()
          AUTH_BY_ID = {str(u.get("id") or ""): u for u in AUTH_USERS if u.get("id")}

          def first_role_user(role):
              rows = api(
                  "/rest/v1/user_roles?select=user_id&role=eq." + urllib.parse.quote(role)
              )
              for row in rows or []:
                  uid = str(row.get("user_id") or "")
                  if uid in AUTH_BY_ID:
                      return uid
              raise RuntimeError("No authenticated user found for role " + role)

          def first_approved_seller_user():
              rows = api(
                  "/rest/v1/sellers?select=user_id,status&status=eq.approved&limit=50"
              )
              for row in rows or []:
                  uid = str(row.get("user_id") or "")
                  if not uid or uid not in AUTH_BY_ID:
                      continue
                  roles = api(
                      "/rest/v1/user_roles?select=user_id&user_id=eq." + urllib.parse.quote(uid) + "&role=eq.seller"
                  )
                  if roles:
                      return uid
              raise RuntimeError("No approved seller user with seller role and Auth account found")

          def user_email(user_id):
              user = AUTH_BY_ID.get(user_id)
              email = str(user.get("email") or "") if user else ""
              if not email:
                  raise RuntimeError("Auth user email not found for " + user_id)
              return email

          def magic_link(email):
              payload = {
                  "type": "magiclink",
                  "email": email,
                  "options": {"redirect_to": PREVIEW + "/#home"},
              }
              result = api("/auth/v1/admin/generate_link", method="POST", payload=payload)
              token_hash = str(result.get("hashed_token") or "")
              if not token_hash:
                  raise RuntimeError("Magic-link token was not returned for " + email)
              return token_hash

          def run_role(page, label, user_id, platform, expected_text, owner_governance=False):
              role = evidence["roles"].setdefault(label, {"user_id_present": bool(user_id)})
              email = user_email(user_id)
              role["email_present"] = bool(email)

              page.goto(PREVIEW + "/#home", wait_until="domcontentloaded", timeout=60000)
              role["http_status"] = 200

              token_hash = magic_link(email)
              page.goto(PREVIEW + "/#home", wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(1200)

              verify = page.evaluate(
                  """async (tokenHash) => {
                    try {
                      const r = await window.mahaSupabase.auth.verifyOtp({ token_hash: tokenHash, type: "magiclink" });
                      return { ok: !!r?.data?.session?.user, id: r?.data?.session?.user?.id || null, error: r?.error?.message || null };
                    } catch (e) {
                      return { ok: false, id: null, error: String(e?.message || e) };
                    }
                  }""",
                  token_hash
              )
              role["magic_link_verify_ok"] = bool(verify.get("ok"))
              page.wait_for_timeout(1500)

              session = page.evaluate("""
                async () => {
                  const r = await window.mahaSupabase.auth.getSession();
                  return {ok: !!r?.data?.session?.user, id: r?.data?.session?.user?.id || null};
                }
              """)
              role["authenticated_session"] = bool(session["ok"])
              role["authenticated_user_match"] = str(session.get("id") or "") == user_id

              if not session["ok"] or not role["authenticated_user_match"]:
                  raise RuntimeError(label + " authentication did not produce the expected user")

              page.goto(PREVIEW + "/#home", wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(1500)

              page.evaluate("(platform) => window.switchPlatform(platform)", platform)
              page.wait_for_function(
                  "(platform) => !!document.getElementById(platform === 'seller' ? 'sellerPlatform' : 'adminPlatform') && document.getElementById(platform === 'seller' ? 'sellerPlatform' : 'adminPlatform').classList.contains('active')",
                  arg=platform,
                  timeout=15000
              )

              platform_id = "sellerPlatform" if platform == "seller" else "adminPlatform"
              content_id = "sellerContent" if platform == "seller" else "adminContent"
              platform_node = page.locator("#" + platform_id)
              content_node = page.locator("#" + content_id)

              # Wait for a real canonical dashboard marker, not the loading spinner.
              canonical_render_selector = (
                  "#sellerContent .seller-welcome"
                  if platform == "seller"
                  else "#adminContent .admin-section-card"
              )
              page.wait_for_function(
                  """
                  (platform) => {
                    const root = document.getElementById(
                      platform === 'seller' ? 'sellerContent' : 'adminContent'
                    );
                    const required = platform === 'seller'
                      ? root?.querySelector('.seller-welcome')
                      : root?.querySelector('.admin-section-card h3');
                    if (!root || !required) return false;
                    const rootText = String(root.innerText || '');
                    const rect = required.getBoundingClientRect();
                    const style = getComputedStyle(required);
                    const loading = root.querySelector('.velora-op-card');
                    if (loading && /Loading|loading|⏳/.test(String(loading.innerText || ''))) return false;
                    return rect.width > 0 && rect.height > 0
                      && style.visibility !== 'hidden'
                      && style.display !== 'none'
                      && rootText.trim().length > 20;
                  }
                  """,
                  arg=platform,
                  timeout=30000
              )
              page.wait_for_timeout(500)
              if owner_governance:
                  page.wait_for_selector('[data-owner-governance="launch-control"]', state="visible", timeout=30000)

              def render_marker_snapshot():
                  return page.evaluate(
                      """(platform) => {
                        const root = document.getElementById(
                          platform === 'seller' ? 'sellerContent' : 'adminContent'
                        );
                        const required = platform === 'seller'
                          ? root?.querySelector('.seller-welcome')
                          : root?.querySelector('.admin-section-card h3');
                        const rect = required?.getBoundingClientRect();
                        return {
                          selector: platform === 'seller'
                            ? '#sellerContent .seller-welcome'
                            : '#adminContent .admin-section-card h3',
                          text: String(required?.innerText || '').trim(),
                          rootTextLength: String(root?.innerText || '').trim().length,
                          visible: !!required && !!rect && rect.width > 0 && rect.height > 0,
                          loadingText: String(root?.querySelector('.velora-op-card')?.innerText || '').trim(),
                          ownerGovernancePresent: !!document.getElementById('ownerGovernanceContent')?.querySelector('[data-owner-governance="launch-control"]'),
                          ownerReleaseControlPresent: !!document.getElementById('ownerGovernanceContent')?.querySelector('[data-owner-release-control="true"]')
                        };
                      }""",
                      platform
                  )

              def runtime_snapshot(stage):
                  snapshot = page.evaluate(
                      """(stage) => {
                        const platform = stage.platform;
                        const el = document.getElementById(platform === 'seller' ? 'sellerPlatform' : 'adminPlatform');
                        const content = document.getElementById(platform === 'seller' ? 'sellerContent' : 'adminContent');
                        const stateUser = window.STATE?.user || null;
                        return {
                          stage: stage.name,
                          hash: String(location.hash || ''),
                          url: String(location.href),
                          documentId: window.__VELORA_BROWSER_EVIDENCE_DOCUMENT_ID || null,
                          platformPresent: !!el,
                          platformActive: !!el?.classList.contains('active'),
                          ariaHidden: el?.getAttribute('aria-hidden') ?? null,
                          contentPresent: !!content,
                          contentTextLength: String(content?.innerText || '').trim().length,
                          stateUser: stateUser ? {
                            uid: stateUser.uid || null,
                            email: stateUser.email || null,
                            role: stateUser.role || null,
                            roles: Array.isArray(stateUser.roles) ? [...stateUser.roles] : null
                          } : null
                        };
                      }""",
                      stage,
                  )
                  session = page.evaluate(
                      """async () => {
                        try {
                          const r = await window.mahaSupabase?.auth?.getSession?.();
                          const s = r?.data?.session;
                          return {
                            available: !!window.mahaSupabase?.auth?.getSession,
                            present: !!s,
                            userId: s?.user?.id || null,
                            email: s?.user?.email || null
                          };
                        } catch (e) {
                          return {
                            available: !!window.mahaSupabase?.auth?.getSession,
                            present: false,
                            userId: null,
                            email: null,
                            error: String(e?.message || e)
                          };
                        }
                      }"""
                  )
                  snapshot["session"] = session
                  snapshot["browserErrors"] = list(browser_errors)
                  return snapshot

              page.evaluate("""() => {
                if (!window.__VELORA_BROWSER_EVIDENCE_DOCUMENT_ID) {
                  window.__VELORA_BROWSER_EVIDENCE_DOCUMENT_ID =
                    (crypto?.randomUUID ? crypto.randomUUID() : String(Date.now()) + '-' + String(Math.random()));
                }
              }""")

              first_open = runtime_snapshot({"name": "first_open", "platform": platform})
              first_open["render_marker"] = render_marker_snapshot()
              role["first_open"] = first_open
              role["first_open_hash"] = first_open["hash"]
              role["first_open_document_id"] = first_open["documentId"]
              role["first_open_active"] = bool(
                  first_open["platformPresent"] and first_open["platformActive"] and first_open["ariaHidden"] == "false"
              )
              role["first_open_expected_content"] = bool(
                  first_open["contentPresent"]
                  and first_open["contentTextLength"] > 0
                  and (
                      platform == "seller"
                      and platform_node.locator("#sellerSidebar").count() == 1
                      and platform_node.locator("#sellerHeaderTitle").inner_text().strip() == "Dashboard"
                  )
                  or (
                      platform == "admin"
                      and platform_node.locator("#adminSidebar").count() == 1
                      and platform_node.locator("#adminHeaderTitle").inner_text().strip() in ("Dashboard", "Owner Dashboard")
                  and (not owner_governance or platform_node.locator('[data-owner-governance="launch-control"]').count() == 1)
                  )
              )
              page.screenshot(path=f"{label}-first-open.png", full_page=True)

              close_fn = "window.VELORA_CLOSE_SELLER()" if platform == "seller" else "window.VELORA_CLOSE_ADMIN()"
              page.evaluate(close_fn)
              page.wait_for_function(
                  "(platform) => { const el=document.getElementById(platform === 'seller' ? 'sellerPlatform' : 'adminPlatform'); return !!el && !el.classList.contains('active'); }",
                  arg=platform,
                  timeout=10000
              )

              close_snapshot = runtime_snapshot({"name": "close", "platform": platform})
              role["close"] = close_snapshot
              role["closed_hash"] = close_snapshot["hash"]
              role["closed_document_id"] = close_snapshot["documentId"]
              role["closed_platform_active"] = bool(close_snapshot["platformActive"])
              role["closed_without_refresh"] = bool(
                  close_snapshot["documentId"]
                  and close_snapshot["documentId"] == role["first_open_document_id"]
                  and not close_snapshot["platformActive"]
              )

              page.screenshot(path=f"{label}-closed.png", full_page=True)

              page.evaluate("(platform) => window.switchPlatform(platform)", platform)
              page.wait_for_function(
                  "(platform) => { const el=document.getElementById(platform === 'seller' ? 'sellerPlatform' : 'adminPlatform'); return !!el && el.classList.contains('active'); }",
                  arg=platform,
                  timeout=15000
              )
              page.wait_for_function(
                  """
                  (platform) => {
                    const root = document.getElementById(
                      platform === 'seller' ? 'sellerContent' : 'adminContent'
                    );
                    const required = platform === 'seller'
                      ? root?.querySelector('.seller-welcome')
                      : root?.querySelector('.admin-section-card h3');
                    if (!root || !required) return false;
                    const rect = required.getBoundingClientRect();
                    const style = getComputedStyle(required);
                    const loading = root.querySelector('.velora-op-card');
                    if (loading && /Loading|loading|⏳/.test(String(loading.innerText || ''))) return false;
                    return rect.width > 0 && rect.height > 0
                      && style.visibility !== 'hidden'
                      && style.display !== 'none'
                      && String(root.innerText || '').trim().length > 20;
                  }
                  """,
                  arg=platform,
                  timeout=30000
              )
              page.wait_for_timeout(500)

              second_open = runtime_snapshot({"name": "second_open", "platform": platform})
              second_open["render_marker"] = render_marker_snapshot()
              second_open["render_marker"] = render_marker_snapshot()
              role["second_open"] = second_open
              role["second_open_hash"] = second_open["hash"]
              role["second_open_document_id"] = second_open["documentId"]
              role["reentry_active_without_refresh"] = bool(
                  second_open["platformPresent"]
                  and second_open["platformActive"]
                  and second_open["ariaHidden"] == "false"
                  and second_open["documentId"] == role["first_open_document_id"]
              )
              role["reentry_expected_content"] = bool(
                  second_open["contentPresent"]
                  and second_open["contentTextLength"] > 0
                  and (
                      platform == "seller"
                      and platform_node.locator("#sellerSidebar").count() == 1
                      and platform_node.locator("#sellerHeaderTitle").inner_text().strip() == "Dashboard"
                  )
                  or (
                      platform == "admin"
                      and platform_node.locator("#adminSidebar").count() == 1
                      and platform_node.locator("#adminHeaderTitle").inner_text().strip() in ("Dashboard", "Owner Dashboard")
                  and (not owner_governance or platform_node.locator('[data-owner-governance="launch-control"]').count() == 1)
                  )
              )
              if platform == "admin" and owner_governance:
                  page.evaluate("""() => window.VELORA_CANONICAL_ADMIN_SECTION('releaseControl')""")
                  page.wait_for_function(
                      "() => !!document.querySelector('#adminContent [data-velora-release-control=" + '"' + "true" + '"' + "]')",
                      timeout=15000,
                  )
                  release_root = page.locator('#adminContent [data-velora-release-control="true"]')
                  release_create = release_root.locator('button').filter(has_text="Create candidate")
                  role["release_control"] = {
                      "present": release_root.count() == 1,
                      "visible": release_root.first.is_visible() if release_root.count() else False,
                      "create_candidate_control_present": release_create.count() >= 1,
                      "text_length": len(release_root.inner_text()) if release_root.count() else 0,
                  }
                  page.screenshot(path="owner-release-control.png", full_page=True)
                  page.evaluate("""() => window.VELORA_CANONICAL_ADMIN_SECTION('payoutControl')""")
                  page.wait_for_function(
                      "() => !!document.querySelector('#adminContent [data-payout-control=" + '"' + "true" + '"' + "]')",
                      timeout=15000,
                  )
                  payout_root = page.locator('#adminContent [data-payout-control="true"]')
                  role["payout_control"] = {
                      "present": payout_root.count() == 1,
                      "visible": payout_root.first.is_visible() if payout_root.count() else False,
                      "text_length": len(payout_root.inner_text()) if payout_root.count() else 0,
                  }
                  page.screenshot(path="owner-payout-control.png", full_page=True)
                  page.evaluate("""() => window.VELORA_CANONICAL_ADMIN_SECTION('finops')""")
                  page.wait_for_function(
                      "() => !!document.querySelector('#adminContent [data-velora-finops-control=" + '"' + "true" + '"' + "]')",
                      timeout=15000,
                  )
                  finops_root = page.locator('#adminContent [data-velora-finops-control="true"]')
                  role["finops_control"] = {
                      "present": finops_root.count() == 1,
                      "visible": finops_root.first.is_visible() if finops_root.count() else False,
                      "text_length": len(finops_root.inner_text()) if finops_root.count() else 0,
                  }
                  page.screenshot(path="owner-finops-control.png", full_page=True)
                  page.evaluate("""() => window.VELORA_CANONICAL_ADMIN_SECTION('subscriptionControl')""")
                  page.wait_for_function(
                      "() => !!document.querySelector('#adminContent [data-subscription-control=" + '"' + "true" + '"' + "]')",
                      timeout=15000,
                  )
                  subscription_root = page.locator('#adminContent [data-subscription-control="true"]')
                  role["subscription_control"] = {
                      "present": subscription_root.count() == 1,
                      "visible": subscription_root.first.is_visible() if subscription_root.count() else False,
                      "text_length": len(subscription_root.inner_text()) if subscription_root.count() else 0,
                  }
                  page.screenshot(path="owner-subscription-control.png", full_page=True)
                  page.evaluate("""() => window.VELORA_CANONICAL_ADMIN_SECTION('sellerAdControl')""")
                  page.wait_for_function(
                      "() => !!document.querySelector('#adminContent [data-seller-ad-control=" + '"' + "true" + '"' + "]')",
                      timeout=15000,
                  )
                  seller_ad_root = page.locator('#adminContent [data-seller-ad-control="true"]')
                  role["seller_ad_control"] = {
                      "present": seller_ad_root.count() == 1,
                      "visible": seller_ad_root.first.is_visible() if seller_ad_root.count() else False,
                      "text_length": len(seller_ad_root.inner_text()) if seller_ad_root.count() else 0,
                  }
                  page.screenshot(path="owner-seller-ad-control.png", full_page=True)
                  page.evaluate("""() => window.VELORA_CANONICAL_ADMIN_SECTION('dashboard')""")
                  page.wait_for_function(
                      "() => !!document.getElementById('ownerGovernanceContent')?.querySelector('[data-owner-governance=" + '"' + "launch-control" + '"' + "]') && !!document.getElementById('ownerGovernanceContent')?.querySelector('[data-owner-release-control=" + '"' + "true" + '"' + "]')",
                      timeout=15000,
                  )

              page.screenshot(path=f"{label}-second-open.png", full_page=True)

              page.evaluate("() => { window.location.hash = 'home'; }")
              page.wait_for_timeout(1200)
              page.evaluate("(platform) => window.switchPlatform(platform)", platform)
              page.wait_for_function(
                  "(platform) => location.hash === '#' + platform && document.getElementById(platform === 'seller' ? 'sellerPlatform' : 'adminPlatform')?.classList.contains('active')",
                  arg=platform,
                  timeout=15000
              )

              page.go_back(wait_until="domcontentloaded", timeout=30000)
              page.wait_for_timeout(1000)
              role["back_hash"] = page.evaluate("() => location.hash")
              role["back_marketplace_active"] = page.locator("#page-home.active").count() == 1

              page.go_forward(wait_until="domcontentloaded", timeout=30000)
              page.wait_for_timeout(1200)
              role["forward_hash"] = page.evaluate("() => location.hash")
              role["forward_platform_active"] = page.locator("#" + platform_id + ".active").count() == 1

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              seller_user = first_approved_seller_user()
              admin_user = first_role_user("admin")
              owner_user = first_role_user("owner")

              evidence["roles"]["seller"] = {"user_id_present": bool(seller_user)}
              evidence["roles"]["admin"] = {"user_id_present": bool(admin_user)}
              evidence["roles"]["owner"] = {"user_id_present": bool(owner_user)}

              seller_page = browser.new_page(viewport={"width": 1440, "height": 1000}, locale="en-US")
              admin_page = browser.new_page(viewport={"width": 1440, "height": 1000}, locale="en-US")
              owner_page = browser.new_page(viewport={"width": 1440, "height": 1000}, locale="en-US")
              for browser_page in (seller_page, admin_page, owner_page):
                  browser_page.on("pageerror", lambda exc: browser_errors.append("pageerror:" + str(exc)))
                  browser_page.on("console", lambda msg: browser_errors.append("console:" + msg.text) if msg.type == "error" else None)

              run_role(seller_page, "seller", seller_user, "seller", "Canonical Seller Center")
              run_role(admin_page, "admin", admin_user, "admin", "Dashboard")
              run_role(owner_page, "owner", owner_user, "admin", "Owner Dashboard", False)

              seller_page.close()
              admin_page.close()
              owner_page.close()
              browser.close()

          for label in ("seller", "admin", "owner"):
              r = evidence["roles"][label]
              expected = [
                  "email_present",
                  "magic_link_verify_ok",
                  "authenticated_session",
                  "authenticated_user_match",
                  "first_open_active",
                  "first_open_expected_content",
                  "closed_without_refresh",
                  "reentry_active_without_refresh",
                  "reentry_expected_content",
                  "back_marketplace_active",
                  "forward_platform_active",
              ]
              for key in expected:
                  if not r.get(key):
                      evidence["failures"].append(label + ": " + key)

              if False and label == "owner":
                  if r.get("second_open", {}).get("render_marker", {}).get("ownerGovernancePresent") is not True:
                      evidence["failures"].append("owner: governance control plane not present")
                  if r.get("second_open", {}).get("render_marker", {}).get("ownerReleaseControlPresent") is not True:
                      evidence["failures"].append("owner: release control not present")
                  if r.get("release_control", {}).get("present") is not True:
                      evidence["failures"].append("owner: release control route not present")
                  if r.get("release_control", {}).get("visible") is not True:
                      evidence["failures"].append("owner: release control route not visible")
                  if r.get("release_control", {}).get("create_candidate_control_present") is not True:
                      evidence["failures"].append("owner: release create control not present")
                  if r.get("payout_control", {}).get("present") is not True:
                      evidence["failures"].append("owner: payout control route not present")
                  if r.get("payout_control", {}).get("visible") is not True:
                      evidence["failures"].append("owner: payout control route not visible")
                  if r.get("finops_control", {}).get("present") is not True:
                      evidence["failures"].append("owner: finops control route not present")
                  if r.get("finops_control", {}).get("visible") is not True:
                      evidence["failures"].append("owner: finops control route not visible")
                  if r.get("subscription_control", {}).get("present") is not True:
                      evidence["failures"].append("owner: subscription control route not present")
                  if r.get("subscription_control", {}).get("visible") is not True:
                      evidence["failures"].append("owner: subscription control route not visible")
                  if r.get("seller_ad_control", {}).get("present") is not True:
                      evidence["failures"].append("owner: seller advertising control route not present")
                  if r.get("seller_ad_control", {}).get("visible") is not True:
                      evidence["failures"].append("owner: seller advertising control route not visible")
              if label == "seller":
                  if r.get("back_hash") not in ("", "#home"):
                      evidence["failures"].append("seller: unexpected back hash " + str(r.get("back_hash")))
                  if r.get("forward_hash") != "#seller":
                      evidence["failures"].append("seller: forward did not restore #seller")
              else:
                  if r.get("back_hash") not in ("", "#home"):
                      evidence["failures"].append("admin: unexpected back hash " + str(r.get("back_hash")))
                  if r.get("forward_hash") != "#admin":
                      evidence["failures"].append("admin: forward did not restore #admin")

          evidence["browser_errors"] = list(dict.fromkeys(browser_errors))[:50]

          with open("seller-admin-reentry-browser-evidence.json", "w", encoding="utf-8") as f:
              json.dump(evidence, f, ensure_ascii=False, indent=2)
          print(json.dumps(evidence, ensure_ascii=False, indent=2))

          if evidence["failures"]:
              sys.exit(1)
          PY

      - name: Publish re-entry evidence commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.reentry.outcome }}';
            const state = outcome === 'success' ? 'success' : 'failure';
            const description = outcome === 'success'
              ? 'Authenticated Seller/Admin re-entry browser evidence passed'
              : 'Authenticated Seller/Admin re-entry browser evidence failed; inspect run artifact';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'Velora / Seller-Admin Reentry Browser Evidence',
              description,
              target_url: 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
      - name: Upload seller/admin reentry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-admin-reentry-browser-evidence
          path: |
            seller-admin-reentry-browser-evidence.json
            seller-first-open.png
            seller-closed.png
            seller-second-open.png
            admin-first-open.png
            admin-closed.png
            admin-second-open.png
            owner-first-open.png
            owner-closed.png
            owner-second-open.png
            owner-release-control.png
            owner-payout-control.png
            owner-finops-control.png
            owner-subscription-control.png
            reentry-local-server.log
          retention-days: 7
