name: WITNESS Velora Pilot

on:
  push:
    branches:
      - audit/runtime-parity-2026-09-28

permissions:
  contents: read

jobs:
  witness-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Velora
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Start Velora local preview
        shell: bash
        run: |
          python3 -m http.server 4173 -d src > /tmp/velora-server.log 2>&1 &
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null

      - name: Check published WITNESS package
        run: npx --yes @witness-engine/cli@0.9.0 doctor

      - name: Provision WITNESS browser runtime
        run: npx --yes @witness-engine/cli@0.9.0 setup

      - name: Authorize local Velora repository
        run: |
          npx --yes @witness-engine/cli@0.9.0 target authorize-local             --url http://127.0.0.1:4173             --repo .             --output ./witness-grant.json

      - name: Run WITNESS against Velora
        id: witness
        continue-on-error: true
        run: |
          set +e
          npx --yes @witness-engine/cli@0.9.0 scan             --url http://127.0.0.1:4173             --grant ./witness-grant.json             --repo .             --mode full             --personas auto             --explore             --max-pages 12             --max-actions 6             --allow-private-origin             --output ./witness-run
          echo "WITNESS_EXIT_CODE=$?"

      - name: Print WITNESS finding summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("witness-run/result.json")
          if not p.exists():
              print("No WITNESS result.json produced.")
              raise SystemExit(0)
          r = json.loads(p.read_text())
          print("TOP_LEVEL_KEYS:", ", ".join(r.keys()))
          for key, value in r.items():
              if not isinstance(value, list) or not value or not isinstance(value[0], dict):
                  continue
              keys = set()
              for item in value[:20]:
                  keys.update(item.keys())
              if keys.intersection({"id","code","severity","title","message","ruleId","findingId"}):
                  print(f"ARRAY {key}: {len(value)}")
                  for item in value[:50]:
                      picked = {k: item.get(k) for k in ("id","code","severity","title","message","ruleId","findingId","path","url") if k in item}
                      print(json.dumps(picked, ensure_ascii=False))
          PY

      - name: Verify WITNESS evidence bundle
        if: always()
        continue-on-error: true
        run: npx --yes @witness-engine/cli@0.9.0 verify --bundle ./witness-run

      - name: Upload WITNESS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witness-velora-pilot
          path: |
            witness-run/
            witness-grant.json
            /tmp/velora-server.log
          if-no-files-found: warn
          retention-days: 7
