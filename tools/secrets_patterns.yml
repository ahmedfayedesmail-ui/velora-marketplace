# Velora secret-detection patterns. Values are regex strings consumed by tools/security_scan.py.
patterns:
  - name: supabase_service_role
    regex: 'service[_-]?role["\x27]?\\s*[:=]\\s*["\x27][A-Za-z0-9_\\-.]{40,}["\x27]'
    severity: critical
  - name: supabase_jwt
    regex: 'eyJ[A-Za-z0-9_-]{100,}'
    severity: critical
  - name: stripe_secret
    regex: 'sk_live_[A-Za-z0-9]{24,}'
    severity: critical
  - name: stripe_restricted
    regex: 'rk_live_[A-Za-z0-9]{24,}'
    severity: critical
  - name: sendgrid_key
    regex: 'SG\\.[A-Za-z0-9_-]{16,}\\.[A-Za-z0-9_-]{16,}'
    severity: critical
  - name: private_key
    regex: '-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
    severity: critical
  - name: api_key_assignment
    regex: '(?i)\\b(?:api[_-]?key|client[_-]?secret|secret[_-]?key)\\s*[:=]\\s*["\x27][^"\x27]{12,}["\x27]'
    severity: high
  - name: password_literal
    regex: '(?i)\\bpassword\\s*[:=]\\s*["\x27][^"\x27]{8,}["\x27]'
    severity: high
  - name: hardcoded_demo_credential
    regex: '(?:Maha@Owner2026|Maha@Admin2026|owner@maha\\.com|admin@maha\\.com)'
    severity: high
